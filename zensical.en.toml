[project]
site_name        = "Home Assistant Documentation by saya6k"
site_author      = "saya6k"
site_url         = "https://saya6k.github.io/home-assistant-config/en/"
site_description = "🏡 My home automation setup built with Home Assistant"

docs_dir = "docs/en"
site_dir = "_site/en"

use_directory_urls = false

repo_url  = "https://github.com/saya6k/home-assistant-config"
repo_name = "home-assistant-config"
edit_uri  = "edit/main/docs/en/"

copyright = "Copyright &copy; 2025 saya6k"

extra_css = ["assets/stylesheet.css"]

nav = [
    { "Home"     = "index.md" },
    { "Hardware" = "hardware.md" },
    { "Platform" = [
        "platform/index.md",
        "platform/network.md",
        "platform/storage.md",
        "platform/backups.md",
        "platform/add-ons.md",
    ] },
    { "Integrations" = [
        "integrations/index.md",
        "integrations/custom-components.md",
        "integrations/esphome.md",
    ] },
    { "Automations" = "automations.md" },
    { "Dashboards"  = "dashboards.md" },
    { "Voice & AI"  = "voice-and-ai.md" },
    { "Observability" = "observability.md" },
    { "Energy"      = "energy.md" },
    { "Services" = [
        "services/index.md",
        "services/paperless.md",
        "services/pocket-id.md",
    ] },
    { "Retired"     = "retired.md" },
    { "Inspiration" = "resources.md" },
]

[project.theme]
language = "en"
logo     = "assets/home_assistant.png"
features = [
    "content.action.edit",
    "content.action.view",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "toc.integrate",
]

[[project.theme.palette]]
media       = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Follow system preference"

[[project.theme.palette]]
media       = "(prefers-color-scheme: light)"
scheme      = "default"
primary     = "light-blue"
accent      = "light-blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media       = "(prefers-color-scheme: dark)"
scheme      = "slate"
primary     = "light-blue"
accent      = "light-blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.extra]
alternate = [
    { name = "한국어",  link = "/home-assistant-config/ko/", lang = "ko" },
    { name = "English", link = "/home-assistant-config/en/", lang = "en" },
]

[project.markdown_extensions.meta]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
