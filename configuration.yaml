####################################################
#                                                  #
#                  Home Assistant                  #
#                                                  #
####################################################

homeassistant:
  packages: !include_dir_named ./packages/
  # Allow directory for camera snapshot
  allowlist_external_dirs: !secret allowlist_external_dirs

  auth_providers:
    - type: homeassistant

####################################################
#                                                  #
#                  Configurations                  #
#                                                  #
####################################################

# Loads default set of integrations. Do not remove.
default_config:
my:
# system_log:
#   fire_event: true

automation: !include ./automations.yaml
scene: !include ./scenes.yaml
script: !include ./scripts.yaml

alarm_control_panel:
  - platform: manual
    name: Security System
    unique_id: alarm_control_panel.security_system
    code: !secret alarm_control_panel_code
    code_arm_required: false
    arming_states:
      - armed_away
      - armed_home
      - armed_night
      - armed_vacation

####################################################
#                                                  #
#                        UI                        #
#                                                  #
####################################################
frontend:
  themes: !include_dir_merge_named ./themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524421

lovelace:
  mode: storage

####################################################
#                                                  #
#                      Recorder                    #
#                                                  #
####################################################
recorder:
  db_url: !secret recorder_mariadb_homeassistant_remote_url
  auto_purge: true
  auto_repack: true
  # purge_keep_days: 10
  commit_interval: 120
  db_max_retries: 15
  db_retry_wait: 5
  # max_event_size: 32168
  exclude:
    domains:
      - camera # 카메라 엔티티 상태(idle/recording)는 거의 변화 없거나 매우 빈번
      - sun # 천문, 예측 가능
      - time_date # 시계
      - todo # 할일 목록 상태 (체크 여부)
      - update # 업데이트 알림 on/off
      - worldclock # 시계
      - event # transient event entities
      - weather. # 날씨 forecast attributes가 5분마다 바뀌어 state_attributes 테이블 무거워질 수 있음.

    entity_globs:
      # Clocks / dates / timers / linear counters
      - sensor.clock*
      - sensor.date*
      - sensor.time*
      - sensor.uptime*
      - sensor.load_*m # 1m/5m/15m 평균 — system_monitor가 별도로 있음
      - sensor.sun*

      # 만료일 / 기념일 / 버전 — 현재값 외 의미 없음
      - sensor.anniversary_*
      - sensor.*cert_expiry
      - sensor.home_assistant_versions*
      - binary_sensor.home_assistant_versions*

      # Automation 헬퍼 (파생값 — 원본만 있으면 재구성 가능)
      - binary_sensor.any_*
      - binary_sensor.all_*
      - sensor.count_*
      - sensor.overview_*
      - binary_sensor.*_approach

    entities:
      - sensor.moon_phase
      - binary_sensor.workday_sensor

    # event_types:
    #   - system_log_event

####################################################
#                                                  #
#                       Logger                     #
#                                                  #
####################################################
logger:
  default: warning
  logs:
    # homeassistant.components.hassio: debug
    homeassistant.components.websocket_api: fatal
    homeassistant.setup: error
    # homeassistant.components.conversation: debug
    # homeassistant.components.intent: debug
    custom_components.ancs: debug
