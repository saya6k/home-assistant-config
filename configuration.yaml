####################################################
#                                                  #
#                  Home Assistant                  #
#                                                  #
####################################################

homeassistant:
  packages: !include_dir_named ./packages/
  # Allow directory for camera snapshot
  allowlist_external_dirs: !secret allowlist_external_dirs

  auth_providers:
    - type: homeassistant

####################################################
#                                                  #
#                  Configurations                  #
#                                                  #
####################################################

# Loads default set of integrations. Do not remove.
default_config:
my:
system_log:
  fire_event: true

automation: !include ./automations.yaml
scene: !include ./scenes.yaml
script: !include ./scripts.yaml

alarm_control_panel:
  - platform: manual
    name: Security System
    unique_id: alarm_control_panel.security_system
    code: !secret alarm_control_panel_code
    code_arm_required: false
    arming_states:
      - armed_away
      - armed_home
      - armed_night
      - armed_vacation

####################################################
#                                                  #
#                        UI                        #
#                                                  #
####################################################
frontend:
  themes: !include_dir_merge_named ./themes
  extra_module_url:
    - /hacsfiles/Bubble-Card/bubble-pop-up.js
    - /hacsfiles/custom-brand-icons/custom-brand-icons.js
    # - /hacsfiles/hass-bha-icons/hass-bha-icons.js
    - /hacsfiles/lovelace-card-mod/card-mod.js
    - /hacsfiles/ha-map-card/ha-map-card.js
    - /hacsfiles/ha-map-card-korea-radar/ha-map-card-korea-radar.js

lovelace:
  mode: storage

####################################################
#                                                  #
#                   Authentication                 #
#                                                  #
####################################################
http:
  cors_allowed_origins: !secret cors_allowed_origins
  use_x_forwarded_for: !secret use_x_forwarded_for
  trusted_proxies: !secret trusted_proxies
  ip_ban_enabled: !secret ip_ban_enabled
  login_attempts_threshold: !secret login_attempts_threshold

# auth_oidc:
#   client_id: !secret oidc_client_id
#   discovery_url: !secret oidc_discovery_url
#   features:
#     automatic_user_linking: true
#   roles:
#     admin: home-admin
#     user: home-user

####################################################
#                                                  #
#                      Recorder                    #
#                                                  #
####################################################
recorder:
  db_url: !secret recorder_mariadb_homeassistant_url
  auto_purge: true
  auto_repack: true
  # purge_keep_days: 2
  commit_interval: 30
  # max_event_size: 32168
  include:
    entities:
      # Include DB and Log size
      - sensor.home_assistant_rdb_size
      - sensor.home_assistant_tsdb_size

      # Include Transmission Upload / Download
      - sensor.transmission_upload_speed
      - sensor.transmission_download_speed

      # Include Speedtest
      - sensor.speedtest_upload
      - sensor.speedtest_download
      - sensor.speedtest_ping

      # Include System Monitoring Sensors
      - sensor.system_monitor_processor_use
      - sensor.system_monitor_processor_temperature
      - sensor.system_monitor_memory_usage
      - sensor.system_monitor_swap_usage
      - sensor.system_monitor_disk_usage
      - sensor.system_monitor_network_throughput_in_end0
      - sensor.system_monitor_network_throughput_out_end0

      # Include Unifi Gateway lite Sensors
      - sensor.gateway_lite_cpu_utilization
      - sensor.gateway_lite_memory_utilization

      #             Total
      - sensor.electricity_bill_used
      - sensor.utility_total_electricity
      - sensor.utility_total_gas
      - sensor.utility_total_water

      #         Energy per Domain
      - sensor.all_hvac_energy_use
      - sensor.all_light_energy_use
      - sensor.all_media_player_energy_use
      - sensor.all_cooker_energy_use

    entity_globs:
      # Include Average Climate Sensors
      - sensor.*_average_temperature
      - sensor.*_average_humidity

      # Include Security Sensors
      - binary_sensor.*_door
      - binary_sensor.*_window
      - binary_sensor.*_motion
      - binary_sensor.*_occupancy

      # Include Health Sensors
      - sensor.withings_*
      - binary_sensor.withings_*

  exclude:
    domains:
      - automation
      - camera
      # - device_tracker
      - event
      - input_datetime
      - input_select
      - media_player
      - sun
      - time_date
      - todo
      - update
      - weather
      - worldclock

    entity_globs:
      - sensor.clock*
      - sensor.date*
      - sensor.load_*m
      - sensor.time*
      - sensor.uptime*

      # Exclude Sun sensors
      - sensor.sun*

      # Exclude Package Tracks
      - sensor.17track*

      # Exclude Oral-B Sensors
      - sensor.smart_series_6000_bae9_*

      # Steam
      - sensor.steam*
      - binary_sensor.steam*

      # Unifi Network

      # Exclude Proximity Sensors
      - sensor.*_direction_of_travel
      - sensor.*_distance
      - sensor.*_nearest_device
      - sensor.*_nearest_direction_of_travel
      - sensor.*_nearest_distance

      # Exclude Discord Game Sensors
      - sensor.discord_user*

      # Exclude github sensors (except stars)
      - sensor.saya6k_home_assistant_config*
      - sensor.saya6k_hassio_addons*
      - sensor.saya6k_mcp_grocy_api*

      # Exclude Grocy sensors
      - binary_sensor.grocy*
      - sensor.grocy*

      # Exclude TrueNAS sensors
      - binary_sensor.truenas_apps*
      - sensor.truenas_apps*

      - binary_sensor.truenas_datasets*
      - sensor.truenas_datasets*

      # - binary_sensor.truenas_disk*
      # - sensor.truenas_disk*

      # - binary_sensor.truenas_system*
      # - sensor.truenas_system*

      - binary_sensor.truenas_services*
      - sensor.truenas_services*

      - binary_sensor.truenas_snapshot_tasks*
      - sensor.truenas_snapshot_tasks*

      # Exclude all entities from occupancy and motion glob
      - binary_sensor.*_occupancy
      - binary_sensor.*_motion

      # Exclude all traffic informations
      - sensor.*beoseu_docag_jeongbo*
      - sensor.subway*

      # Exclude all anniversaries
      - sensor.anniversary_*

      # Exclude all Version Sensors
      - binary_sensor.home_assistant_versions*
      - sensor.home_assistant_versions*

      # Exclude all Cert Expiration
      - sensor.*cert_expiry

      # Exclude Youtube channels
      - sensor.*views
      - sensor.*lastest_upload
      - sensor.*subscribers

      # Exclude some helpers for automations
      - binary_sensor.any_*
      - binary_sensor.all_*
      - sensor.count_*
      - sensor.overview_*
      - binary_sensor.*_approach

    entities:
      - sensor.season
      - sensor.zodiac
      - sensor.moon_phase

      # - sensor.template_domain_counter
      - binary_sensor.workday_sensor

    # Exclude an event_type
    event_types:
      # - call_service
      - system_log_event

####################################################
#                                                  #
#                       Logger                     #
#                                                  #
####################################################
logger:
  default: warning
  logs:
    # homeassistant.components.hassio: debug
    homeassistant.components.websocket_api: fatal
    homeassistant.setup: error
    # homeassistant.components.conversation: debug
    # homeassistant.components.intent: debug
    # custom_components.hass_dyson: debug

####################################################
#                                                  #
#               Long Term History                  #
#                                                  #
####################################################
prometheus:
  namespace: hass
  filter:
    include_entities:
      #################################
      #                               #
      #             Energy            #
      #                               #
      #################################

      #             Total
      - sensor.utility_total_electricity
      - sensor.utility_total_gas
      - sensor.utility_total_water

      #         Energy per Domain
      - sensor.all_hvac_energy_use
      - sensor.all_light_energy_use
      - sensor.all_media_player_energy_use

      #################################
      #                               #
      #        Home Assistant         #
      #                               #
      #################################

      # Home Assistant Statistics
      - sensor.integrations
      - sensor.custom_integrations
      - sensor.areas

      # - sensor.zones # In Entity Domains Counter
      - sensor.devices
      - sensor.entities

      # Entities per Domains Statistics
      - sensor.air_quality
      - sensor.alarm_control_panels
      - sensor.automations
      - sensor.binary_sensors
      - sensor.buttons
      - sensor.calendars
      - sensor.cameras
      - sensor.climate
      - sensor.covers
      - sensor.dates
      - sensor.datetimes
      - sensor.device_trackers
      - sensor.fans
      - sensor.humidifiers
      - sensor.images
      - sensor.input_booleans
      - sensor.input_buttons
      - sensor.input_datetimes
      - sensor.input_numbers
      - sensor.input_selects
      - sensor.input_texts
      - sensor.lights
      - sensor.locks
      - sensor.media_players
      - sensor.numbers
      - sensor.persons
      - sensor.remotes
      - sensor.scenes
      - sensor.scripts
      - sensor.selects
      - sensor.sensors
      - sensor.sirens
      - sensor.stt
      - sensor.suns
      - sensor.switches
      - sensor.texts
      - sensor.times
      - sensor.tts
      - sensor.update
      - sensor.vacuums
      - sensor.water_heaters
      - sensor.weather
      - sensor.zones

    exclude_entity_globs:
      #################################
      #                               #
      #       Indoor Environment      #
      #                               #
      #################################

      #     Environmental Sensor globs
      - sensor.*_average_temperature
      - sensor.*_average_humidity

      # Home Assistant Database Statistics
      - sensor.home_assistant_rdb_*
      - sensor.home_assistant_tsdb_size

command_line:

  - sensor:
      name: 'Home Assistant TSDB Size'
      icon: mdi:database
      command: '/usr/bin/du -s /share/victoria-metrics-data | cut -f1'
      value_template: "{{ (value.split('\t')[0]|int/1000)|round(1) }}"
      device_class: data_size
      unit_of_measurement: 'MB'
      unique_id: 'victoriametrics_db_size'
      scan_interval: 600
