blueprint:
  name: Morning Todo Task Automation with Expanded Scheduling Options
  description: A blueprint to remove completed tasks and add new optional tasks, with
    expanded scheduling options.
  domain: automation
  input:
    tasklist:
      name: Todo List
      description: The to-do list entity to manage.
      selector:
        entity:
          filter:
          - domain:
            - todo
          multiple: false
          reorder: false
    schedule:
      name: Update Frequency
      description: 'Choose how often the task list should be updated.

        - **Daily:** Runs every day at **01:00 AM** (removes completed) and **01:05
        AM** (adds new tasks).

        - **Weekend:** Runs **only on Saturdays** at 01:00 AM / 01:05 AM.

        - **Every Other Weekend:** Runs **only on odd-numbered ISO weeks** (e.g.,
        Week 1, 3, 5, etc.) on Saturdays.

        - **Once a Month (First Weekend):** Runs **only on the first Saturday of the
        month**.

        '
      selector:
        select:
          options:
          - Daily
          - Weekend
          - Every Other Weekend
          - Once a Month (First Weekend)
          sort: false
          multiple: false
          custom_value: false
    task_1_name:
      name: Task 1 Name (Optional)
      description: The name of the first to-do item.
      selector:
        text:
          multiple: false
          multiline: false
      default: ''
    task_2_name:
      name: Task 2 Name (Optional)
      description: The name of the second to-do item.
      selector:
        text:
          multiple: false
          multiline: false
      default: ''
    task_3_name:
      name: Task 3 Name (Optional)
      description: The name of the third to-do item.
      selector:
        text:
          multiple: false
          multiline: false
      default: ''
    task_4_name:
      name: Task 4 Name (Optional)
      description: The name of the fourth to-do item.
      selector:
        text:
          multiple: false
          multiline: false
      default: ''
    task_5_name:
      name: Task 5 Name (Optional)
      description: The name of the fifth to-do item.
      selector:
        text:
          multiple: false
          multiline: false
      default: ''
  source_url: https://gist.githubusercontent.com/harung1993/d02c64d381f75a701f6658106d679813/raw/recurring_todo.yaml
trigger:
- platform: time
  at: 01:00:00
- platform: time
  at: 01:05:00
- platform: event
  event_type: manual_trigger
condition:
- condition: template
  value_template: "{% set schedule_option = '!input schedule' %} {% if trigger.platform
    == 'event' and trigger.event.event_type == 'manual_trigger' %}\n  true\n{% elif
    schedule_option == \"Daily\" %}\n  true\n{% elif schedule_option == \"Weekend\"
    %}\n  {{ now().weekday() == 5 }}\n{% elif schedule_option == \"Every Other Weekend\"
    %}\n  {{ now().weekday() == 5 and now().isocalendar()[1] % 2 == 1 }}  # Odd ISO
    weeks\n{% elif schedule_option == \"Once a Month (First Weekend)\" %}\n  {{ now().weekday()
    == 5 and now().day <= 7 }}  # First Saturday of the month\n{% else %}\n  false\n{%
    endif %}\n"
variables:
  tasklist: !input tasklist
  tasks:
  - name: !input task_1_name
  - name: !input task_2_name
  - name: !input task_3_name
  - name: !input task_4_name
  - name: !input task_5_name
action:
- service: todo.remove_completed_items
  target:
    entity_id: '{{ tasklist }}'
- service: todo.get_items
  target:
    entity_id: '{{ tasklist }}'
  data:
    status:
    - needs_action
  response_variable: todos
- alias: Add new tasks if not already in "needs_action"
  repeat:
    for_each: '{{ tasks | selectattr(''name'', ''!='', '''') | list }}'
    sequence:
    - variables:
        taskname: '{{ repeat.item.name }}'
    - condition: template
      value_template: '{{ taskname not in todos[tasklist][''items''] | map(attribute=''summary'')
        | list }}

        '
    - service: todo.add_item
      target:
        entity_id: '{{ tasklist }}'
      data:
        item: '{{ taskname }}'
