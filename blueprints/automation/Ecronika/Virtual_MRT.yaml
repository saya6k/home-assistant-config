blueprint:
  name: Virtual MRT v0.1.15
  description: '### Virtual Mean Radiant Temperature (v0.1.15)


    Computes **Mean Radiant Temperature (MRT)** and **Operative Temperature** to improve
    HVAC comfort.

    Compensates for cold walls (drafts) and solar gain (greenhouse effect).


    ### Key Features

    - **Thermal Mass:** Configurable response speed (Concrete vs. Drywall).

    - **Safe Mode:** Pauses updates if sensors fail to prevent freezing/overheating.

    - **Quiet:** Debug logging is **off** by default. Only critical sensor failures
    are logged.


    ### Requirements

    - Home Assistant 2023.x or newer.

    - Weather Integration: Optimized for **Pirate Weather** or **Met.no** (requires
    attributes like cloud cover/wind).

    '
  domain: automation
  author: Tobias Paul
  source_url: https://gist.github.com/Ecronika/846873c4479b2dc99e3d0b45f816206c
  input:
    air_temp:
      name: Room Air Temperature
      description: Sensor measuring current room temperature.
      selector:
        entity:
          domain:
          - sensor
          device_class:
          - temperature
          multiple: false
          reorder: false
    weather_entity:
      name: Weather Entity
      description: Provides outdoor conditions (Temp, Wind, Clouds, UV).
      selector:
        entity:
          domain:
          - weather
          multiple: false
          reorder: false
    room_profile:
      name: Room Profile (Insulation & Windows)
      description: Select the building fabric profile.
      default: one_wall_large_window
      selector:
        select:
          options:
          - label: 1 exterior wall, large window
            value: one_wall_large_window
          - label: 2 exterior walls, large window
            value: two_wall_large_window
          - label: Top floor (Attic/High solar gain)
            value: attic
          - label: Top floor (Vertical windows, small)
            value: topfloor_vert_small_window
          - label: Top floor (Vertical windows, medium)
            value: topfloor_vert_medium_window
          - label: Top floor (2 ext walls/cavity)
            value: topfloor_two_walls_cavity
          - label: Top floor (Cold adjacent room)
            value: topfloor_cold_adjacent
          - label: 2 exterior walls, small window
            value: two_wall_small_window
          - label: 1 exterior wall, small window
            value: one_wall_small_window
          - label: Basement / Semi-basement
            value: basement
          - label: 1 exterior wall, cold adjacent room
            value: one_wall_cold_adjacent
          - label: Corner room, cold adjacent room
            value: corner_cold_adjacent
          - label: Interior room (No exterior walls)
            value: interior
          - label: Interior room (Cold adjacent room)
            value: interior_cold_adjacent
          sort: false
          custom_value: false
          multiple: false
    orientation:
      name: Main Window Orientation
      description: Direction the main window faces.
      default: S
      selector:
        select:
          options:
          - N
          - NE
          - E
          - SE
          - S
          - SW
          - W
          - NW
          sort: false
          custom_value: false
          multiple: false
    smoothing_factor:
      name: Thermal Mass (Response Speed)
      description: 'How fast the room reacts to changes. - 0.05 - 0.10: Very slow
        (Heavy concrete/Stone/Floor heating) - 0.30: Standard (Brick/Mixed construction)
        - 0.80 - 1.00: Fast (Light construction/Glass/Container)

        '
      default: 0.3
      selector:
        number:
          min: 0.05
          max: 1.0
          step: 0.05
          mode: slider
    enable_logging:
      name: Enable Logbook Debugging
      description: Writes detailed calculation data to the Logbook every 5 minutes.
        Keep disabled to reduce noise.
      default: false
      selector:
        boolean: {}
    sensor_solar_radiation:
      name: Global Radiation Sensor (Optional)
      description: W/m². Highly recommended for accuracy. If skipped, a heuristic
        is used.
      default: ''
      selector:
        entity:
          domain:
          - sensor
          multiple: false
          reorder: false
    target_mrt_helper:
      name: 'Output: MRT Helper (Optional)'
      description: input_number to store Mean Radiant Temperature.
      default: ''
      selector:
        entity:
          domain:
          - input_number
          multiple: false
          reorder: false
    target_oper_temp_helper:
      name: 'Output: Operative Temp Helper (Optional)'
      description: input_number to store Operative Temperature.
      default: ''
      selector:
        entity:
          domain:
          - input_number
          multiple: false
          reorder: false
    knx_ga_mrt:
      name: 'KNX GA: MRT (Optional)'
      description: Group Address (DPT 9.001) for MRT.
      default: ''
      selector:
        text:
          multiline: false
          multiple: false
    knx_ga_oper_temp:
      name: 'KNX GA: Operative Temp (Optional)'
      description: Group Address (DPT 9.001) for Operative Temp.
      default: ''
      selector:
        text:
          multiline: false
          multiple: false
mode: restart
max_exceeded: silent
trigger:
- platform: time_pattern
  minutes: /5
  id: cycle
- platform: homeassistant
  event: start
  id: ha_start
- platform: event
  event_type: automation_reloaded
  id: ha_reload
variables:
  air: !input air_temp
  out_mrt: !input target_mrt_helper
  out_op: !input target_oper_temp_helper
  W: !input weather_entity
  profile: !input room_profile
  orient: !input orientation
  knx_ga_mrt: !input knx_ga_mrt
  knx_ga_op: !input knx_ga_oper_temp
  ext_rad_sensor: !input sensor_solar_radiation
  smooth_k: !input smoothing_factor
  debug_log: !input enable_logging
  wx_entity_id: '{{ W }}'
  wx_prefix: '{{ wx_entity_id.split(''.'', 1)[1] if wx_entity_id is not none else
    '''' }}'
  pw_temp_entity: '{{ ''sensor.'' ~ wx_prefix ~ ''_temperature'' }}'
  pw_app_entity: '{{ ''sensor.'' ~ wx_prefix ~ ''_apparent_temperature'' }}'
  pw_wind_entity: '{{ ''sensor.'' ~ wx_prefix ~ ''_wind_speed'' }}'
  pw_gust_entity: '{{ ''sensor.'' ~ wx_prefix ~ ''_wind_gust'' }}'
  pw_uv_entity: '{{ ''sensor.'' ~ wx_prefix ~ ''_uv_index'' }}'
  pw_cloud_entity_1: '{{ ''sensor.'' ~ wx_prefix ~ ''_cloud_cover'' }}'
  pw_cloud_entity_2: '{{ ''sensor.'' ~ wx_prefix ~ ''_cloud_coverage'' }}'
  pw_precip_entity_1: '{{ ''sensor.'' ~ wx_prefix ~ ''_precipitation_intensity'' }}'
  pw_precip_entity_2: '{{ ''sensor.'' ~ wx_prefix ~ ''_precip_intensity'' }}'
  k_uv: 90
  cloud_weight: 0.9
  base_rain_penalty: 0.6
  wind_factor: 0.02
  f_out: "{% set m = {\n  'one_wall_large_window':        0.5,\n  'two_wall_large_window':
    \       0.8,\n  'attic':                        0.9,\n  'topfloor_vert_small_window':
    \  0.90,\n  'topfloor_vert_medium_window':  0.90,\n  'topfloor_two_walls_cavity':
    \   0.95,\n  'topfloor_cold_adjacent':       0.95,\n  'two_wall_small_window':
    \       0.7,\n  'one_wall_small_window':        0.5,\n  'basement':                     0.4,\n
    \ 'one_wall_cold_adjacent':       0.6,\n  'corner_cold_adjacent':         0.8,\n
    \ 'interior':                     0.0,\n  'interior_cold_adjacent':       0.3\n}
    %} {{ m.get(profile, 0.5) }}\n"
  f_win: "{% set m = {\n  'one_wall_large_window':        0.4,\n  'two_wall_large_window':
    \       0.5,\n  'attic':                        0.4,\n  'topfloor_vert_small_window':
    \  0.15,\n  'topfloor_vert_medium_window':  0.30,\n  'topfloor_two_walls_cavity':
    \   0.25,\n  'topfloor_cold_adjacent':       0.35,\n  'two_wall_small_window':
    \       0.3,\n  'one_wall_small_window':        0.2,\n  'basement':                     0.2,\n
    \ 'one_wall_cold_adjacent':       0.3,\n  'corner_cold_adjacent':         0.4,\n
    \ 'interior':                     0.0,\n  'interior_cold_adjacent':       0.0\n}
    %} {{ m.get(profile, 0.2) }}\n"
  k_loss: "{% set m = {\n  'one_wall_large_window':        0.14,\n  'two_wall_large_window':
    \       0.16,\n  'attic':                        0.20,\n  'topfloor_vert_small_window':
    \  0.23,\n  'topfloor_vert_medium_window':  0.22,\n  'topfloor_two_walls_cavity':
    \   0.24,\n  'topfloor_cold_adjacent':       0.23,\n  'two_wall_small_window':
    \       0.16,\n  'one_wall_small_window':        0.12,\n  'basement':                     0.10,\n
    \ 'one_wall_cold_adjacent':       0.18,\n  'corner_cold_adjacent':         0.20,\n
    \ 'interior':                     0.08,\n  'interior_cold_adjacent':       0.12\n}
    %} {{ m.get(profile, 0.14) }}\n"
  k_solar: "{% set m = {\n  'one_wall_large_window':        1.20,\n  'two_wall_large_window':
    \       1.40,\n  'attic':                        1.50,\n  'topfloor_vert_small_window':
    \  0.75,\n  'topfloor_vert_medium_window':  1.00,\n  'topfloor_two_walls_cavity':
    \   0.95,\n  'topfloor_cold_adjacent':       1.15,\n  'two_wall_small_window':
    \       1.00,\n  'one_wall_small_window':        0.80,\n  'basement':                     0.60,\n
    \ 'one_wall_cold_adjacent':       0.80,\n  'corner_cold_adjacent':         1.00,\n
    \ 'interior':                     0.40,\n  'interior_cold_adjacent':       0.40\n}
    %} {{ m.get(profile, 1.20) }}\n"
  south_factor: '{% set m = {''N'':0.2,''NE'':0.4,''E'':0.6,''SE'':0.8,''S'':1.0,''SW'':0.8,''W'':0.6,''NW'':0.4}
    %} {{ m.get(orient, 1.0) }}

    '
  T_air_raw: '{{ states(air) }}'
  T_air_unit: '{{ (state_attr(air, ''unit_of_measurement'') | string | lower) }}'
  T_air: "{% set v = T_air_raw %} {% if v not in ['unknown','unavailable','none','None','']
    %}\n  {% set t = v | float(default=none) %}\n  {% if t is not none %}\n    {%
    set u = T_air_unit %}\n    {% if 'f' in u %}\n      {% set t = (t - 32) * 5 /
    9 %}\n    {% elif u in ['k','kelvin'] %}\n      {% set t = t - 273.15 %}\n    {%
    endif %}\n    {{ t }}\n  {% else %}\n    {{ none }}\n  {% endif %}\n{% else %}\n
    \ {{ none }}\n{% endif %}\n"
  pw_temp_raw: '{{ states(pw_temp_entity) }}'
  pw_temp_unit: '{{ (state_attr(pw_temp_entity, ''unit_of_measurement'') | string
    | lower) if pw_temp_entity is not none else '''' }}'
  pw_temp_ok: "{% set v = pw_temp_raw %} {% if v not in ['unknown','unavailable','none','None','']
    %}\n  {% set t = v | float(default=none) %}\n  {% if t is not none %}\n    {%
    set u = pw_temp_unit %}\n    {% if 'f' in u %}{% set t = (t - 32) * 5 / 9 %}{%
    elif u in ['k','kelvin'] %}{% set t = t - 273.15 %}{% endif %}\n    {% if -50
    <= t <= 60 %}{{ t }}{% else %}{{ none }}{% endif %}\n  {% else %}{{ none }}{%
    endif %}\n{% else %}{{ none }}{% endif %}\n"
  pw_app_raw: '{{ states(pw_app_entity) }}'
  pw_app_unit: '{{ (state_attr(pw_app_entity, ''unit_of_measurement'') | string |
    lower) if pw_app_entity is not none else '''' }}'
  pw_app_ok: "{% set v = pw_app_raw %} {% if v not in ['unknown','unavailable','none','None','']
    %}\n  {% set t = v | float(default=none) %}\n  {% if t is not none %}\n    {%
    set u = pw_app_unit %}\n    {% if 'f' in u %}{% set t = (t - 32) * 5 / 9 %}{%
    elif u in ['k','kelvin'] %}{% set t = t - 273.15 %}{% endif %}\n    {% if -60
    <= t <= 60 %}{{ t }}{% else %}{{ none }}{% endif %}\n  {% else %}{{ none }}{%
    endif %}\n{% else %}{{ none }}{% endif %}\n"
  w_temp_raw: '{{ state_attr(W, ''temperature'') }}'
  w_temp_ok: "{% set t = w_temp_raw | float(default=none) %} {% if t is not none %}\n
    \ {% set u = (state_attr(W, 'temperature_unit') | string | lower) %}\n  {% if
    'f' in u %}{% set t = (t - 32) * 5 / 9 %}{% elif u in ['k','kelvin'] %}{% set
    t = t - 273.15 %}{% endif %}\n  {% if -50 <= t <= 60 %}{{ t }}{% else %}{{ none
    }}{% endif %}\n{% else %}{{ none }}{% endif %}\n"
  w_app_raw: '{{ state_attr(W, ''apparent_temperature'') }}'
  w_app_ok: "{% set t = w_app_raw | float(default=none) %} {% if t is not none %}\n
    \ {% set u = (state_attr(W, 'temperature_unit') | string | lower) %}\n  {% if
    'f' in u %}{% set t = (t - 32) * 5 / 9 %}{% elif u in ['k','kelvin'] %}{% set
    t = t - 273.15 %}{% endif %}\n  {% if -60 <= t <= 60 %}{{ t }}{% else %}{{ none
    }}{% endif %}\n{% else %}{{ none }}{% endif %}\n"
  T_out_source_temp: '{% if pw_temp_ok is not none %}sensor {% elif w_temp_ok is not
    none %}weather_attr {% else %}fallback{% endif %}

    '
  T_out_val: "{% if pw_temp_ok is not none %}\n  {{ pw_temp_ok }}\n{% elif w_temp_ok
    is not none %}\n  {{ w_temp_ok }}\n{% else %}\n  {{ none }}\n{% endif %}\n"
  T_app_source_temp: '{% if pw_app_ok is not none %}sensor {% elif w_app_ok is not
    none %}weather_attr {% else %}none{% endif %}

    '
  T_app_val: "{% if pw_app_ok is not none %}\n  {{ pw_app_ok }}\n{% elif w_app_ok
    is not none %}\n  {{ w_app_ok }}\n{% else %}\n  {{ none }}\n{% endif %}\n"
  T_out_eff: "{% if T_out_val is none %}\n  {{ none }}\n{% elif T_app_val is not none
    %}\n  {% if (T_out_val | float) <= (T_app_val | float) %}\n    {{ T_out_val }}\n
    \ {% else %}\n    {{ T_app_val }}\n  {% endif %}\n{% else %}\n  {{ T_out_val }}\n{%
    endif %}\n"
  T_out_eff_source: "{% if T_app_val is not none %}\n  eff(min(temp={{T_out_source_temp}},app={{T_app_source_temp}}))\n{%
    else %}\n  temp={{T_out_source_temp}}\n{% endif %}\n"
  pw_wind_raw: '{{ states(pw_wind_entity) }}'
  pw_wind_unit: '{{ (state_attr(pw_wind_entity, ''unit_of_measurement'') | string
    | lower) if pw_wind_entity is not none else '''' }}'
  pw_wind_ok: "{% set v = pw_wind_raw %} {% if v not in ['unknown','unavailable','none','None','']
    %}\n  {% set s = v | float(default=none) %}\n  {% if s is not none %}\n    {%
    set u = pw_wind_unit %}\n    {% if 'm/s' in u or 'mps' in u %}{% set s = s * 3.6
    %}{% elif 'mph' in u %}{% set s = s * 1.60934 %}{% endif %}\n    {% if s >= 0
    %}{{ s }}{% else %}{{ none }}{% endif %}\n  {% else %}{{ none }}{% endif %}\n{%
    else %}{{ none }}{% endif %}\n"
  pw_gust_raw: '{{ states(pw_gust_entity) }}'
  pw_gust_unit: '{{ (state_attr(pw_gust_entity, ''unit_of_measurement'') | string
    | lower) if pw_gust_entity is not none else '''' }}'
  pw_gust_ok: "{% set v = pw_gust_raw %} {% if v not in ['unknown','unavailable','none','None','']
    %}\n  {% set s = v | float(default=none) %}\n  {% if s is not none %}\n    {%
    set u = pw_gust_unit %}\n    {% if 'm/s' in u or 'mps' in u %}{% set s = s * 3.6
    %}{% elif 'mph' in u %}{% set s = s * 1.60934 %}{% endif %}\n    {% if s >= 0
    %}{{ s }}{% else %}{{ none }}{% endif %}\n  {% else %}{{ none }}{% endif %}\n{%
    else %}{{ none }}{% endif %}\n"
  w_wind_raw: '{{ state_attr(W, ''wind_speed'') }}'
  w_wind_ok: "{% set s = w_wind_raw | float(default=none) %} {% if s is not none %}\n
    \ {% set u = (state_attr(W, 'wind_speed_unit') | string | lower) %}\n  {% if 'mph'
    in u %}{% set s = s * 1.60934 %}{% elif 'm/s' in u or 'mps' in u %}{% set s =
    s * 3.6 %}{% endif %}\n  {% if s >= 0 %}{{ s }}{% else %}{{ none }}{% endif %}\n{%
    else %}{{ none }}{% endif %}\n"
  w_gust_raw: '{{ state_attr(W, ''wind_gust_speed'') }}'
  w_gust_ok: "{% set s = w_gust_raw | float(default=none) %} {% if s is not none %}\n
    \ {% set u = (state_attr(W, 'wind_speed_unit') | string | lower) %}\n  {% if 'mph'
    in u %}{% set s = s * 1.60934 %}{% elif 'm/s' in u or 'mps' in u %}{% set s =
    s * 3.6 %}{% endif %}\n  {% if s >= 0 %}{{ s }}{% else %}{{ none }}{% endif %}\n{%
    else %}{{ none }}{% endif %}\n"
  wind_kmh_effective: "{% set base_sens = pw_wind_ok if pw_wind_ok is not none else
    w_wind_ok %} {% set gust_sens = pw_gust_ok if pw_gust_ok is not none else w_gust_ok
    %} {% if base_sens is not none and gust_sens is not none %}\n  {% if (base_sens
    | float) >= (gust_sens | float) %}\n    {{ base_sens }}\n  {% else %}\n    {{
    gust_sens }}\n  {% endif %}\n{% elif base_sens is not none %}\n  {{ base_sens
    }}\n{% elif gust_sens is not none %}\n  {{ gust_sens }}\n{% else %}\n  0.0\n{%
    endif %}\n"
  wind_source: "{% if pw_wind_ok is not none or pw_gust_ok is not none %}\n  sensor\n{%
    elif w_wind_ok is not none or w_gust_ok is not none %}\n  weather_attr\n{% else
    %}\n  fallback\n{% endif %}\n"
  wind_ms: '{{ (wind_kmh_effective | float(0)) / 3.6 | round(2) }}'
  pw_cloud_raw: "{% set v1 = states(pw_cloud_entity_1) %} {% set v2 = states(pw_cloud_entity_2)
    %} {% if v1 not in ['unknown','unavailable','none','None',''] %}\n  {{ v1 }}\n{%
    else %}\n  {{ v2 }}\n{% endif %}\n"
  pw_cloud_ok: "{% set v = pw_cloud_raw %} {% if v not in ['unknown','unavailable','none','None','']
    %}\n  {% set f = v | float(default=none) %}\n  {% if f is not none and 0 <= f
    <= 100 %}{{ f }}{% else %}{{ none }}{% endif %}\n{% else %}{{ none }}{% endif
    %}\n"
  w_cloud_raw: "{% set a = state_attr(W, 'cloud_coverage') %} {% if a is none %}\n
    \ {% set a = state_attr(W, 'cloudiness') %}\n{% endif %} {{ a }}\n"
  w_cloud_ok: "{% if w_cloud_raw is not none %}\n  {% set f = w_cloud_raw | float(default=none)
    %}\n  {% if f is not none and 0 <= f <= 100 %}{{ f }}{% else %}{{ none }}{% endif
    %}\n{% else %}{{ none }}{% endif %}\n"
  cond_raw: '{{ states(W) | string | lower }}'
  cond_ok: '{% set c = cond_raw %} {% if c in [''unknown'',''unavailable'',''none'','''']
    %}{{ none }}{% else %}{{ c }}{% endif %}

    '
  clouds_cov_final: "{% set sunny_list = ['sunny', 'clear', 'clear-night', 'mostly-sunny',
    'partlycloudy', 'partly-cloudy'] %} {% if pw_cloud_ok is not none %}\n  {{ pw_cloud_ok
    | float }}\n{% elif w_cloud_ok is not none %}\n  {% set val = w_cloud_ok | float
    %}\n  {# Ensure list-based check instead of substring match #}\n  {% if val >
    60 and cond_ok is not none and cond_ok in sunny_list %}\n    35\n  {% else %}\n
    \   {{ val }}\n  {% endif %}\n{% else %}\n  {% if cond_ok in ['sunny','clear','clear-night']
    %}\n    0\n  {% elif cond_ok in ['partlycloudy','partly-cloudy','mostly-sunny']
    %}\n    50\n  {% elif cond_ok is not none %}\n    100\n  {% else %}\n    100\n
    \ {% endif %}\n{% endif %}\n"
  clouds_source: "{% set sunny_list = ['sunny', 'clear', 'clear-night', 'mostly-sunny',
    'partlycloudy', 'partly-cloudy'] %} {% if pw_cloud_ok is not none %}sensor {%
    elif w_cloud_ok is not none %}\n  {% set val = w_cloud_ok | float %}\n  {% if
    val > 60 and cond_ok is not none and cond_ok in sunny_list %}\n    weather_attr(clamped)\n
    \ {% else %}\n    weather_attr\n  {% endif %}\n{% elif cond_ok is not none %}heuristic(cond)
    {% else %}default(100) {% endif %}\n"
  pw_uv_raw: '{{ states(pw_uv_entity) }}'
  pw_uv_ok: "{% set v = pw_uv_raw %} {% if v not in ['unknown','unavailable','none','None','']
    %}\n  {% set f = v | float(default=none) %}\n  {% if f is not none and f >= 0
    %}{{ f }}{% else %}{{ none }}{% endif %}\n{% else %}{{ none }}{% endif %}\n"
  w_uv_raw: '{{ state_attr(W, ''uv_index'') }}'
  w_uv_ok: "{% if w_uv_raw is not none %}\n  {% set f = w_uv_raw | float(default=none)
    %}\n  {% if f is not none and f >= 0 %}{{ f }}{% else %}{{ none }}{% endif %}\n{%
    else %}{{ none }}{% endif %}\n"
  sun_elev_raw: '{{ state_attr(''sun.sun'',''elevation'') }}'
  sun_elev_ok: "{% if sun_elev_raw is not none %}\n  {% set e = sun_elev_raw | float(default=none)
    %}\n  {% if e is not none and -90 <= e <= 90 %}{{ e }}{% else %}{{ none }}{% endif
    %}\n{% else %}{{ none }}{% endif %}\n"
  sun_up: '{{ is_state(''sun.sun'',''above_horizon'') }}'
  UV_final: "{% if pw_uv_ok is not none %}\n  {{ pw_uv_ok | float }}\n{% elif w_uv_ok
    is not none %}\n  {{ w_uv_ok | float }}\n{% else %}\n  {% if sun_up and (clouds_cov_final
    | float(100)) < 60 and (sun_elev_ok | float(0) > 10) %}\n    1.0\n  {% else %}\n
    \   0.0\n  {% endif %}\n{% endif %}\n"
  UV_source: '{% if pw_uv_ok is not none %}sensor {% elif w_uv_ok is not none %}weather_attr
    {% else %}heuristic(sun/cloud){% endif %}

    '
  pw_precip_raw: "{% set v1 = states(pw_precip_entity_1) %} {% set v2 = states(pw_precip_entity_2)
    %} {% if v1 not in ['unknown','unavailable','none','None',''] %}\n  {{ v1 }}\n{%
    else %}\n  {{ v2 }}\n{% endif %}\n"
  pw_precip_unit: "{% set u1 = (state_attr(pw_precip_entity_1, 'unit_of_measurement')
    | string | lower) %} {% set u2 = (state_attr(pw_precip_entity_2, 'unit_of_measurement')
    | string | lower) %} {% if states(pw_precip_entity_1) not in ['unknown','unavailable','none','None','']
    %}\n  {{ u1 }}\n{% else %}\n  {{ u2 }}\n{% endif %}\n"
  pw_precip_ok: "{% set v = pw_precip_raw %} {% if v not in ['unknown','unavailable','none','None','']
    %}\n  {% set p = v | float(default=0) %}\n  {% set u = pw_precip_unit %}\n  {%
    if 'in' in u and '/h' in u %}{% set p = p * 25.4 %}{% endif %}\n  {% if p < 0
    %}0{% else %}{{ p }}{% endif %}\n{% else %}0{% endif %}\n"
  rainy_bool: '{% set c = cond_ok if cond_ok is not none else '''' %} {{ ''rain''
    in c or ''pour'' in c or ''snow'' in c or ''hail'' in c }}

    '
  rain_mul: "{% if pw_precip_ok | float(0) > 0 %}\n  {% set penalty = (pw_precip_ok
    | float(0)) / 5.0 %}\n  {% if penalty > 1 %}{% set penalty = 1 %}{% endif %}\n
    \ {{ 1 - (penalty * base_rain_penalty) }}\n{% else %}\n  {% if rainy_bool %}\n
    \   {{ 1 - base_rain_penalty }}\n  {% else %}\n    1\n  {% endif %}\n{% endif
    %}\n"
  rain_source: '{% if (pw_precip_ok | float(0)) > 0 %}sensor {% elif rainy_bool %}condition_string
    {% else %}dry {% endif %}

    '
  sun_elev_clip: '{% set e = sun_elev_ok if sun_elev_ok is not none else -90 %} {{
    [ -6.0, [ e, 60.0 ] | min ] | max }}

    '
  day_fac: '{{ ((sun_elev_clip + 6.0) / 66.0) | float | round(3) }}'
  day_fac_eff: "{% set clouds = clouds_cov_final | float(100) %} {% if UV_source in
    ['sensor','weather_attr'] and clouds < 20 %}\n  {% set df = day_fac | float(0)
    %}\n  {{ (0.5 + 0.5 * df) | round(3) }}\n{% else %}\n  {{ day_fac }}\n{% endif
    %}\n"
  ext_rad_raw: '{{ states(ext_rad_sensor) if ext_rad_sensor | length > 0 else none
    }}'
  ext_rad_ok: "{% set v = ext_rad_raw %} {% if v not in [none, 'unknown','unavailable','none','None','']
    %}\n  {% set f = v | float(default=none) %}\n  {% if f is not none and 0 <= f
    <= 1300 %}{{ f }}{% else %}{{ none }}{% endif %}\n{% else %}{{ none }}{% endif
    %}\n"
  rad_est: "{% if ext_rad_ok is not none %}\n  {{ (ext_rad_ok | float) | round(1)
    }}\n{% else %}\n  {% set base = k_uv * (UV_final | float(0)) %}\n  {% set cloudy
    = [0, 1 - (cloud_weight * (clouds_cov_final | float(100) / 100.0))] | max %}\n
    \ {% set rm = rain_mul | float(1) %}\n  {% if sun_up %}\n    {{ [0, [ base * cloudy
    * rm * (day_fac_eff | float(0)), 1000 ] | min ] | max | round(1) }}\n  {% else
    %}\n    0\n  {% endif %}\n{% endif %}\n"
  rad_source: "{% if ext_rad_ok is not none %}ext_sensor {% elif UV_source in ['sensor','weather_attr']
    and (clouds_cov_final | float) < 20 %}\n  heuristic(UV/cloud/rain/sun, boosted)\n{%
    else %}heuristic(UV/cloud/rain/sun) {% endif %}\n"
  loss_term: "{% if T_air is not none and T_out_eff is not none %}\n  {{ (k_loss |
    float)\n     * ( (T_air | float) - (T_out_eff | float) )\n     * ( (f_out | float)
    + 1.5 * (f_win | float) )\n     * (1 + wind_factor * (wind_ms | float)) }}\n{%
    else %}\n  {{ none }}\n{% endif %}\n"
  solar_term: "{{ (k_solar | float)\n   * ((rad_est | float) / 400)\n   * (south_factor
    | float)\n   * (f_win | float) }}\n"
  MRT_calc: "{% if loss_term is not none and T_air is not none %}\n   {{ (T_air |
    float) - (loss_term | float) + (solar_term | float) }}\n{% else %}\n   {{ none
    }}\n{% endif %}\n"
  lower_dyn: '{{ [ (T_out_eff | float(-50) + 2.0), (T_air | float(21) - 3.0) ] | max
    }}'
  upper_dyn: '{{ (T_air | float(21) + 4.0) }}'
  MRT: "{% if MRT_calc is not none %}\n  {{ [ lower_dyn, [ MRT_calc, upper_dyn ] |
    min ] | max | round(1) }}\n{% else %}\n  {{ none }}\n{% endif %}\n"
  MRT_plaus_floor: '{% set floor1 = (T_out_eff | float(-50)) - 5 %} {% set floor2
    = (T_air | float(21)) - 15 %} {{ [floor1, floor2, -30] | max }}

    '
  MRT_plaus_ceil: '{% set ceil1 = (T_air | float(21)) + 10 %} {% set ceil2 = (T_out_eff
    | float(21)) + 30 %} {{ [ceil1, ceil2, 60] | min }}

    '
  MRT_prev_raw: '{{ states(out_mrt) if out_mrt | length > 0 else none }}'
  MRT_prev_candidate: '{{ MRT_prev_raw | float(none) if MRT_prev_raw is not none else
    none }}'
  MRT_prev_sane: "{% set current = MRT %} {% if current is not none %}\n  {% set pv
    = MRT_prev_candidate %}\n  {% if pv is none %}\n    {{ current }}\n  {% elif pv
    < 5 %}\n    {# Filter out values < 5°C to avoid startup glitches (initial 0.0).
    #}\n    {# This ignores initial garbage values unless the room is genuinely freezing.
    #}\n    {{ current }}\n  {% elif (pv - (current|float)) > 2 %}\n    {{ current
    }}\n  {% else %}\n    {% set lo = MRT_plaus_floor | float(-30) %}\n    {% set
    hi = MRT_plaus_ceil | float(60) %}\n    {% if pv < lo %}\n      {{ lo }}\n    {%
    elif pv > hi %}\n      {{ hi }}\n    {% else %}\n      {{ pv }}\n    {% endif
    %}\n  {% endif %}\n{% else %}\n  {{ none }}\n{% endif %}\n"
  MRT_out: "{% if MRT is not none and MRT_prev_sane is not none %}\n  {% set k = smooth_k
    | float(0.3) %}\n  {{ ((1 - k) * (MRT_prev_sane | float) + k * (MRT | float))
    | round(1) }}\n{% else %}\n  {{ none }}\n{% endif %}\n"
  T_op_out: "{% if MRT_out is not none and T_air is not none %}\n  {{ ((T_air | float)
    + (MRT_out | float)) / 2 | round(1) }}\n{% else %}\n  {{ none }}\n{% endif %}\n"
  inputs_valid: '{{ T_air is not none and T_out_eff is not none and MRT_out is not
    none }}

    '
action:
- choose:
  - conditions:
    - condition: template
      value_template: '{{ trigger.id in [''ha_start'', ''ha_reload''] and knx_ga_mrt
        != '''' and out_mrt != '''' }}'
    sequence:
    - service: knx.exposure_register
      data:
        address: '{{ knx_ga_mrt }}'
        type: temperature
        entity_id: '{{ out_mrt }}'
- choose:
  - conditions:
    - condition: template
      value_template: '{{ trigger.id in [''ha_start'', ''ha_reload''] and knx_ga_op
        != '''' and out_op != '''' }}'
    sequence:
    - service: knx.exposure_register
      data:
        address: '{{ knx_ga_op }}'
        type: temperature
        entity_id: '{{ out_op }}'
- choose:
  - conditions:
    - condition: template
      value_template: '{{ trigger.id == ''cycle'' and out_mrt != '''' }}'
    - condition: template
      value_template: '{{ inputs_valid }}'
    - condition: template
      value_template: '{{ (states(out_mrt) | float(0) - MRT_out | float(0)) | abs
        >= 0.1 }}'
    sequence:
    - service: input_number.set_value
      target:
        entity_id: '{{ out_mrt }}'
      data:
        value: "{% set u = (state_attr(out_mrt, 'unit_of_measurement') | string |
          lower) %} {% set knx_active = (knx_ga_mrt | length > 0) %} {% if knx_active
          %}\n  {{ MRT_out }}\n{% else %}\n  {% if 'f' in u %}\n    {{ ((MRT_out |
          float) * 9 / 5 + 32) | round(1) }}\n  {% else %}\n    {{ MRT_out }}\n  {%
          endif %}\n{% endif %}\n"
- choose:
  - conditions:
    - condition: template
      value_template: '{{ trigger.id == ''cycle'' and out_op != '''' }}'
    - condition: template
      value_template: '{{ inputs_valid }}'
    - condition: template
      value_template: '{{ (states(out_op) | float(0) - T_op_out | float(0)) | abs
        >= 0.1 }}'
    sequence:
    - service: input_number.set_value
      target:
        entity_id: '{{ out_op }}'
      data:
        value: "{% set u = (state_attr(out_op, 'unit_of_measurement') | string | lower)
          %} {% set knx_active = (knx_ga_op | length > 0) %} {% if knx_active %}\n
          \ {{ T_op_out }}\n{% else %}\n  {% if 'f' in u %}\n    {{ ((T_op_out | float)
          * 9 / 5 + 32) | round(1) }}\n  {% else %}\n    {{ T_op_out }}\n  {% endif
          %}\n{% endif %}\n"
- choose:
  - conditions:
    - condition: template
      value_template: '{{ trigger.id == ''cycle'' and inputs_valid and debug_log }}'
    sequence:
    - service: logbook.log
      data:
        name: Virtual MRT v0.1.15
        message: 'Profile={{ profile }}, Orient={{ orient }}, Smooth={{ smooth_k }},
          T_in={{ T_air }}°C, T_out={{ T_out_eff }}°C, MRT_calc={{ MRT_calc | round(1)
          }}°C, MRT_out={{ MRT_out }}°C

          '
        entity_id: '{{ out_mrt if out_mrt != '''' else out_op }}'
  - conditions:
    - condition: template
      value_template: '{{ trigger.id == ''cycle'' and not inputs_valid }}'
    sequence:
    - service: logbook.log
      data:
        name: Virtual MRT v0.1.15
        message: 'SKIPPED UPDATE: Sensors unavailable. T_in={{ T_air_raw }}, T_out={{
          T_out_eff }}

          '
        entity_id: '{{ out_mrt if out_mrt != '''' else out_op }}'
