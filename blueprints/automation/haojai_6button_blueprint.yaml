mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  var_button_1: !input button_1_entity
  var_button_2: !input button_2_entity
  var_button_3: !input button_3_entity
  var_button_4: !input button_4_entity
  var_button_5: !input button_5_entity
  var_button_6: !input button_6_entity

trigger:
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_1 }}"
    id: button_1
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_2 }}"
    id: button_2
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_3 }}"
    id: button_3
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_4 }}"
    id: button_4
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_5 }}"
    id: button_5
  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: "{{ var_button_6 }}"
    id: button_6

condition:
  - condition: template
    value_template: >-
      {{ trigger.event.data.old_state.state != 'unavailable'
         and trigger.event.data.new_state.state != 'unavailable' }}

action:
  - variables:
      event_type: "{{ trigger.event.data.new_state.attributes.event_type }}"
  - choose:
      # === Button 1 ===
      - conditions:
          - condition: trigger
            id: button_1
          - condition: template
            value_template: "{{ event_type == 'multi_press_1' }}"
        sequence: !input button_1_single
      - conditions:
          - condition: trigger
            id: button_1
          - condition: template
            value_template: "{{ event_type == 'multi_press_2' }}"
        sequence: !input button_1_double
      - conditions:
          - condition: trigger
            id: button_1
          - condition: template
            value_template: "{{ event_type == 'long_press' }}"
        sequence: !input button_1_long_press
      - conditions:
          - condition: trigger
            id: button_1
          - condition: template
            value_template: "{{ event_type == 'long_release' }}"
        sequence: !input button_1_long_release
      # === Button 2 ===
      - conditions:
          - condition: trigger
            id: button_2
          - condition: template
            value_template: "{{ event_type == 'multi_press_1' }}"
        sequence: !input button_2_single
      - conditions:
          - condition: trigger
            id: button_2
          - condition: template
            value_template: "{{ event_type == 'multi_press_2' }}"
        sequence: !input button_2_double
      - conditions:
          - condition: trigger
            id: button_2
          - condition: template
            value_template: "{{ event_type == 'long_press' }}"
        sequence: !input button_2_long_press
      - conditions:
          - condition: trigger
            id: button_2
          - condition: template
            value_template: "{{ event_type == 'long_release' }}"
        sequence: !input button_2_long_release
      # === Button 3 ===
      - conditions:
          - condition: trigger
            id: button_3
          - condition: template
            value_template: "{{ event_type == 'multi_press_1' }}"
        sequence: !input button_3_single
      - conditions:
          - condition: trigger
            id: button_3
          - condition: template
            value_template: "{{ event_type == 'multi_press_2' }}"
        sequence: !input button_3_double
      - conditions:
          - condition: trigger
            id: button_3
          - condition: template
            value_template: "{{ event_type == 'long_press' }}"
        sequence: !input button_3_long_press
      - conditions:
          - condition: trigger
            id: button_3
          - condition: template
            value_template: "{{ event_type == 'long_release' }}"
        sequence: !input button_3_long_release
      # === Button 4 ===
      - conditions:
          - condition: trigger
            id: button_4
          - condition: template
            value_template: "{{ event_type == 'multi_press_1' }}"
        sequence: !input button_4_single
      - conditions:
          - condition: trigger
            id: button_4
          - condition: template
            value_template: "{{ event_type == 'multi_press_2' }}"
        sequence: !input button_4_double
      - conditions:
          - condition: trigger
            id: button_4
          - condition: template
            value_template: "{{ event_type == 'long_press' }}"
        sequence: !input button_4_long_press
      - conditions:
          - condition: trigger
            id: button_4
          - condition: template
            value_template: "{{ event_type == 'long_release' }}"
        sequence: !input button_4_long_release
      # === Button 5 ===
      - conditions:
          - condition: trigger
            id: button_5
          - condition: template
            value_template: "{{ event_type == 'multi_press_1' }}"
        sequence: !input button_5_single
      - conditions:
          - condition: trigger
            id: button_5
          - condition: template
            value_template: "{{ event_type == 'multi_press_2' }}"
        sequence: !input button_5_double
      - conditions:
          - condition: trigger
            id: button_5
          - condition: template
            value_template: "{{ event_type == 'long_press' }}"
        sequence: !input button_5_long_press
      - conditions:
          - condition: trigger
            id: button_5
          - condition: template
            value_template: "{{ event_type == 'long_release' }}"
        sequence: !input button_5_long_release
      # === Button 6 ===
      - conditions:
          - condition: trigger
            id: button_6
          - condition: template
            value_template: "{{ event_type == 'multi_press_1' }}"
        sequence: !input button_6_single
      - conditions:
          - condition: trigger
            id: button_6
          - condition: template
            value_template: "{{ event_type == 'multi_press_2' }}"
        sequence: !input button_6_double
      - conditions:
          - condition: trigger
            id: button_6
          - condition: template
            value_template: "{{ event_type == 'long_press' }}"
        sequence: !input button_6_long_press
      - conditions:
