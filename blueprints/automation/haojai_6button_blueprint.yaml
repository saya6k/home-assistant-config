blueprint:
  name: HAOJAI 6 Button Smart Switch (Matter over Thread)
  description: >
    HAOJAI 6버튼 스마트 스위치 (Matter over Thread) Blueprint.

    각 버튼마다 단일 클릭, 더블 클릭, 길게 누르기, 길게 누르기 해제 액션을 설정할 수 있습니다.

    지원 이벤트: multi_press_1, multi_press_2, long_press, long_release

    Version: 2026-04-11
  domain: automation
  input:
    button_1_section:
      name: Button 1
      collapsed: true
      input:
        button_1_entity:
          name: Button 1 Entity
          description: 버튼 1의 event entity를 선택하세요.
          selector:
            entity:
              domain: event
              device_class: button
              multiple: false
        button_1_single:
          name: "Button 1: Single Press"
          description: 버튼 1 단일 클릭 (multi_press_1)
          default: []
          selector:
            action: {}
        button_1_double:
          name: "Button 1: Double Press"
          description: 버튼 1 더블 클릭 (multi_press_2)
          default: []
          selector:
            action: {}
        button_1_long_press:
          name: "Button 1: Long Press"
          description: 버튼 1 길게 누르기
          default: []
          selector:
            action: {}
        button_1_long_release:
          name: "Button 1: Long Release"
          description: 버튼 1 길게 누르기 해제
          default: []
          selector:
            action: {}
    button_2_section:
