blueprint:
  name: Voice - Devices Schedules Controller
  author: luuquangvu
  description: "# Devices Schedules Controller used for Voice Assistant\n* Uses the
    Devices Schedules script to manage per-device timers (start / cancel / cancel_all
    / extend / pause / resume / list).\n* Accepts friendly names from the LLM, resolves
    them to entity_ids via the provided alias sensor, and can operate on multiple
    devices in one request.\n* For `start`, the blueprint dispatches timers via `script.turn_on`
    with on-completion actions to turn the device on/off. Other modes call the Devices
    Schedules script directly to receive structured responses.\n## Blueprint Setup\n###
    Required\n* The `devices_schedules.yaml` blueprint needs to be installed.\n* The
    mentioned file(s) is/are included in the repository.\n* A template sensor stores
    all information about entity aliases needs to be configured in `config/configuration.yaml`;
    The sensor is required for friendly-name lookup.\n```\n#File configuration.yaml\nshell_command:\n
    \ get_entity_alias: jq '[.data.entities[] | select(.options.conversation.should_expose
    == true and (.aliases | length > 0)) | {entity_id, aliases}]' ./.storage/core.entity_registry\ntemplate:\n
    \ - triggers:\n      - trigger: homeassistant\n        event: start\n      - trigger:
    event\n        event_type: event_template_reloaded\n    actions:\n      - action:
    shell_command.get_entity_alias\n        response_variable: response\n    sensor:\n
    \     - name: \"Assist: Entity IDs and Aliases\"\n        unique_id: entity_ids_and_aliases\n
    \       icon: mdi:format-list-bulleted\n        device_class: timestamp\n        state:
    \"{{ now().isoformat() }}\"\n        attributes:\n          entities: \"{{ response.stdout
    }}\"\n\n```\n### Note\n* Make sure to expose the entities you want to control
    to Assist.\n* Make sure to expose the script to Assist after the script has been
    saved.\n* Do not alter the default script name.\n* Once the script is created,
    click the three dots in the top right corner, choose \"Edit in YAML,\" and remove
    the `description: ...` line to restore the default. This step is important because
    it helps the LLM better understand the script's purpose."
  domain: script
  homeassistant:
    min_version: 2024.10.0
  input:
    required_settings:
      name: Required settings
      icon: mdi:script-text
      description: Select the dependencies used by this blueprint.
      input:
        timer_script:
          name: Devices Schedules script entity
          description: Script entity created from the Devices Schedules blueprint.
          selector:
            entity:
              filter:
              - domain:
                - script
              multiple: false
              reorder: false
        entity_aliases:
          name: Entity aliases sensor
          description: Template sensor attribute that lists exposed entities with
            friendly-name aliases.
          selector:
            entity:
              filter:
              - domain:
                - sensor
                integration: template
              multiple: false
              reorder: false
    prompt_settings:
      name: Prompt settings for the LLM
      icon: mdi:robot
      description: Optional prompt overrides used by the LLM when collecting arguments.
      collapsed: true
      input:
        entities_prompt:
          name: Entities prompt
          selector:
            text:
              multiline: true
              multiple: false
          default: 'Required when the chosen mode operates on specific devices (start,
            cancel, extend, pause, resume).

            Specify one or more friendly names or entity_ids and separate multiple
            entries with semicolons.

            For cancel_all, supply devices to limit the cancellation or leave this
            field empty to cancel every active schedule/timer.

            Leave it empty to list every schedule/timer entry.'
        mode_prompt:
          name: Mode prompt
          selector:
            text:
              multiline: true
              multiple: false
          default: 'Required. Choose exactly one mode:

            - start: create a new schedule/timer for the selected device(s) and run
            the specified expire action when it ends.

            - cancel: stop the active schedule/timer for each listed device immediately.

            - cancel_all: cancel every active schedule/timer (limit by listing device
            names, or leave empty to cancel everything).

            - extend: add the given duration to the current schedule/timer for each
            listed device.

            - pause: freeze the running schedule/timer for each listed device, preserving
            remaining time.

            - resume: restart a paused schedule/timer for each listed device.

            - list: return active schedule/timer entries (leave entities blank for
            all, or provide a device to filter).'
        action_prompt:
          name: Action prompt
          selector:
            text:
              multiline: true
              multiple: false
          default: 'Required only when mode = start. Ignore for other modes.

            Use ''turn_on'' to run the turn on service when the schedule/timer expires,
            or ''turn_off'' to run the turn off service.'
        duration_prompt:
          name: Duration prompt
          selector:
            text:
              multiline: true
              multiple: false
          default: 'This argument is required when the mode is start or extend.

            Specify the delay using the HH:MM:SS format (relative to the current time).

            If a query specifies a particular target time, calculate the delay from
            the current time to that specified time.

            For extend, use the same format to indicate how much time to add to the
            schedule/timer (e.g., 00:05:00 adds five minutes).'
  source_url: https://github.com/luuquangvu/tutorials/blob/main/devices_schedules_controller_full_llm.yaml
mode: parallel
max_exceeded: silent
description: Manages and controls schedules/timers for various devices.
variables:
  version: 20251116
fields:
  mode:
    name: Mode
    description: !input mode_prompt
    required: true
    selector:
      select:
        options:
        - start
        - cancel
        - cancel_all
        - extend
        - pause
        - resume
        - list
  entities:
    name: Entities
    description: !input entities_prompt
    selector:
      text:
  action:
    name: Expire action
    description: !input action_prompt
    selector:
      select:
        options:
        - label: Turn on
          value: turn_on
        - label: Turn off
          value: turn_off
  duration:
    name: Duration (HH:MM:SS)
    description: !input duration_prompt
    selector:
      text:
sequence:
- variables:
    _timer_script: !input timer_script
    _entity_aliases: !input entity_aliases
    _mode: '{{ (mode | default(''list'', true)) | string | lower | trim }}'
    _entities_raw: '{{ entities | default('''', true) }}'
    _action_raw: '{{ action | default('''', true) }}'
    _duration_raw: '{{ duration | default(''00:00:00'', true) }}'
    _entity_names: "{% set ns = namespace(items=[]) %} {% set source = _entities_raw
      %} {% for name in source.split(';') %}\n  {% set trimmed = name.strip() %}\n
      \ {% if trimmed|length > 0 %}\n    {% set ns.items = ns.items + [trimmed] %}\n
      \ {% endif %}\n{% endfor %} {{ ns.items }}\n"
    _alias_list: '{{ state_attr(_entity_aliases, ''entities'') | default([], true)
      }}'
    _missing_entities: "{% set ns = namespace(items=[]) %} {% set alias_list = _alias_list
      if _alias_list is sequence else [] %} {% for name in _entity_names %}\n  {%
      set direct = states | selectattr('entity_id', 'equalto', name) | list %}\n  {%
      if direct | count == 0 %}\n    {% set friendly = states | selectattr('attributes.friendly_name',
      'equalto', name) | list %}\n    {% set alias_matches = alias_list | selectattr('aliases',
      'contains', name) | list %}\n    {% if friendly | count == 0 and alias_matches
      | count == 0 %}\n      {% set ns.items = ns.items + [name] %}\n    {% endif
      %}\n  {% endif %}\n{% endfor %} {{ ns.items }}\n"
    _resolved_entities: "{% set ns = namespace(items=[]) %} {% set alias_list = _alias_list
      if _alias_list is sequence else [] %} {% for name in _entity_names %}\n  {%
      set direct = states | selectattr('entity_id', 'equalto', name) | map(attribute='entity_id')
      | list %}\n  {% if direct | count > 0 %}\n    {% for ent in direct %}\n      {%
      if ent not in ns.items %}\n        {% set ns.items = ns.items + [ent] %}\n      {%
      endif %}\n    {% endfor %}\n  {% else %}\n    {% set friendly = states | selectattr('attributes.friendly_name',
      'equalto', name) | map(attribute='entity_id') | list %}\n    {% if friendly
      | count > 0 %}\n      {% for ent in friendly %}\n        {% if ent not in ns.items
      %}\n          {% set ns.items = ns.items + [ent] %}\n        {% endif %}\n      {%
      endfor %}\n    {% else %}\n      {% set alias_devices = alias_list | selectattr('aliases',
      'contains', name) | map(attribute='entity_id') | list %}\n      {% for ent in
      alias_devices %}\n        {% if ent not in ns.items %}\n          {% set ns.items
      = ns.items + [ent] %}\n        {% endif %}\n      {% endfor %}\n    {% endif
      %}\n  {% endif %}\n{% endfor %} {{ ns.items }}\n"
    _duration_seconds: "{% set raw = _duration_raw %} {% if raw is number %}\n  {{
      raw | round(0) | int }}\n{% elif raw is string and raw | trim | length > 0 %}\n
      \ {% set td = as_timedelta(raw) %}\n  {% if td is not none and td is not string
      %}\n    {{ td.total_seconds() | round(0) | int }}\n  {% else %}\n    {% set
      text = raw | trim %}\n    {% set parts = text.split(':') %}\n    {% if parts
      | count >= 3 %}\n      {% set hours = (parts[-3] | default('0') | float) %}\n
      \     {% set minutes = (parts[-2] | default('0') | float) %}\n      {% set seconds
      = (parts[-1] | default('0') | float) %}\n      {{ (hours * 3600 + minutes *
      60 + seconds) | round(0) | int }}\n    {% elif parts | count == 2 %}\n      {%
      set minutes = (parts[0] | default('0') | float) %}\n      {% set seconds = (parts[1]
      | default('0') | float) %}\n      {{ (minutes * 60 + seconds) | round(0) | int
      }}\n    {% else %}\n      {{ parts[0] | default('0') | float | round(0) | int
      }}\n    {% endif %}\n  {% endif %}\n{% else %}\n  0\n{% endif %}\n"
    _action_normalized: "{% set raw = (_action_raw | string | lower | trim) %} {%
      if raw in ['turn_on', 'on', 'true', '1', 'yes'] %}\n  turn_on\n{% elif raw in
      ['turn_off', 'off', 'false', '0', 'no'] %}\n  turn_off\n{% else %}\n  ''\n{%
      endif %}\n"
    _action_service: '{{ ''homeassistant.'' ~ _action_normalized if (_action_normalized
      | length) > 0 else '''' }}'
    _responses: []
- choose:
  - conditions: '{{ _entity_names | count > 0 and (_missing_entities | count) > 0
      }}'
    sequence:
    - variables:
        response: "{{\n  dict(\n    error='Unknown device name(s): ' ~ (_missing_entities
          | join(', ')),\n    mode=_mode\n  )\n}}\n"
    - stop: 'Unknown device name(s): {{ _missing_entities | join('', '') }}'
      response_variable: response
  - conditions: '{{ _mode in [''start'',''cancel'',''extend'',''pause'',''resume'']
      and (_resolved_entities | count) == 0 }}'
    sequence:
    - variables:
        response: "{{\n  dict(\n    error='No controllable devices were resolved for
          the request.',\n    mode=_mode\n  )\n}}\n"
    - stop: No controllable devices were resolved for the request.
      response_variable: response
  - conditions: '{{ _mode in [''start'', ''extend''] and _duration_seconds <= 0 }}'
    sequence:
    - variables:
        response: "{{\n  dict(\n    error='Duration must be greater than zero seconds
          for this mode.',\n    mode=_mode\n  )\n}}\n"
    - stop: Duration must be greater than zero seconds.
      response_variable: response
  - conditions: '{{ _mode == ''start'' and _action_normalized not in [''turn_on'',
      ''turn_off''] }}'
    sequence:
    - variables:
        response: "{{\n  dict(\n    error='Invalid expire action; choose turn_on or
          turn_off when starting a schedule.',\n    mode=_mode,\n    action=_action_raw\n
          \ )\n}}\n"
    - stop: Invalid expire action; expected turn_on or turn_off.
      response_variable: response
- choose:
  - conditions: '{{ _mode == ''start'' }}'
    sequence:
    - repeat:
        for_each: '{{ _resolved_entities }}'
        sequence:
        - service: script.turn_on
          target:
            entity_id: '{{ _timer_script }}'
          data:
            variables:
              mode: start
              target_entity: '{{ repeat.item }}'
              duration_seconds: '{{ _duration_seconds }}'
              expire_actions:
              - action: '{{ _action_service }}'
        - variables:
            _responses: '{{ (_responses | default([])) + [dict(mode=''start'', entity=repeat.item,
              status=''queued'', duration_seconds=_duration_seconds, action=_action_normalized)]
              }}'
    - variables:
        response: "{{\n  dict(\n    mode='start',\n    action=_action_normalized,\n
          \   duration_seconds=_duration_seconds,\n    targets=_resolved_entities,\n
          \   dispatched=_responses\n  )\n}}\n"
  - conditions: '{{ _mode == ''cancel_all'' }}'
    sequence:
    - choose:
      - conditions: '{{ _resolved_entities | count > 0 }}'
        sequence:
        - repeat:
            for_each: '{{ _resolved_entities }}'
            sequence:
            - service: '{{ _timer_script }}'
              data:
                mode: cancel_all
                target_entity: '{{ repeat.item }}'
              response_variable: _call_result
            - variables:
                _responses: '{{ (_responses | default([])) + [_call_result] }}'
      default:
      - service: '{{ _timer_script }}'
        data:
          mode: cancel_all
        response_variable: _call_result
      - variables:
          _responses: '{{ [_call_result] }}'
    - variables:
        response: "{{\n  dict(\n    mode='cancel_all',\n    targets=_resolved_entities,\n
          \   results=_responses\n  )\n}}\n"
  - conditions: '{{ _mode == ''extend'' }}'
    sequence:
    - repeat:
        for_each: '{{ _resolved_entities }}'
        sequence:
        - service: '{{ _timer_script }}'
          data:
            mode: extend
            target_entity: '{{ repeat.item }}'
            extend_seconds: '{{ _duration_seconds }}'
          response_variable: _call_result
        - variables:
            _responses: '{{ (_responses | default([])) + [_call_result] }}'
    - variables:
        response: "{{\n  dict(\n    mode='extend',\n    extend_seconds=_duration_seconds,\n
          \   results=_responses\n  )\n}}\n"
  - conditions: '{{ _mode in [''cancel'', ''pause'', ''resume''] }}'
    sequence:
    - repeat:
        for_each: '{{ _resolved_entities }}'
        sequence:
        - service: '{{ _timer_script }}'
          data:
            mode: '{{ _mode }}'
            target_entity: '{{ repeat.item }}'
          response_variable: _call_result
        - variables:
            _responses: '{{ (_responses | default([])) + [_call_result] }}'
    - variables:
        response: "{{\n  dict(\n    mode=_mode,\n    results=_responses\n  )\n}}\n"
  - conditions: '{{ _mode == ''list'' }}'
    sequence:
    - choose:
      - conditions: '{{ _resolved_entities | count > 0 }}'
        sequence:
        - repeat:
            for_each: '{{ _resolved_entities }}'
            sequence:
            - service: '{{ _timer_script }}'
              data:
                mode: list
                list_entity_filter: '{{ repeat.item }}'
              response_variable: _call_result
            - variables:
                _responses: '{{ (_responses | default([])) + [_call_result] }}'
      default:
      - service: '{{ _timer_script }}'
        data:
          mode: list
        response_variable: _call_result
      - variables:
          _responses: '{{ [_call_result] }}'
    - variables:
        _list_results_with_names: "{% set responses = _responses | default([]) %}
          {% set outer = namespace(items=[]) %} {% for item in responses %}\n  {%
          if item is mapping %}\n    {% set timers = item.timers if item.timers is
          sequence else [] %}\n    {% set timer_ns = namespace(items=[]) %}\n    {%
          for timer in timers %}\n      {% if timer is mapping %}\n        {% set
          entity_id = timer.entity_id | default('') | string %}\n        {% set friendly
          = state_attr(entity_id, 'friendly_name') %}\n        {% if friendly is none
          or (friendly | string | trim) == '' or (friendly | string | lower) in ['unknown',
          'unavailable'] %}\n          {% set alias_list = _alias_list if _alias_list
          is sequence else [] %}\n          {% set alias_match = alias_list | selectattr('entity_id',
          'equalto', entity_id) | map(attribute='aliases') | list %}\n          {%
          if alias_match | count > 0 %}\n            {% set aliases = alias_match[0]
          if alias_match[0] is sequence else [] %}\n            {% if aliases | count
          > 0 %}\n              {% set friendly = aliases[0] %}\n            {% endif
          %}\n          {% endif %}\n        {% endif %}\n        {% if friendly is
          none or (friendly | string | trim) == '' or (friendly | string | lower)
          in ['unknown', 'unavailable'] %}\n          {% set entity_part = (entity_id.split('.')[-1]
          if '.' in entity_id else entity_id) %}\n          {% set friendly = (entity_part
          | replace('_', ' ') | title) %}\n        {% endif %}\n        {% if friendly
          is none or (friendly | string | trim) == '' %}\n          {% set friendly
          = entity_id %}\n        {% endif %}\n        {% set timer_pairs = timer.items()
          | list %}\n        {% set timer_ns.items = timer_ns.items + [dict(timer_pairs
          + [('friendly_name', friendly)])] %}\n      {% else %}\n        {% set timer_ns.items
          = timer_ns.items + [timer] %}\n      {% endif %}\n    {% endfor %}\n    {%
          set item_pairs = item.items() | list %}\n    {% set outer.items = outer.items
          + [dict(item_pairs + [('timers', timer_ns.items)])] %}\n  {% else %}\n    {%
          set outer.items = outer.items + [item] %}\n  {% endif %}\n{% endfor %} {{
          outer.items }}\n"
        response: "{{\n  dict(\n    mode='list',\n    targets=_resolved_entities,\n
          \   results=_list_results_with_names\n  )\n}}\n"
  default:
  - variables:
      response: "{{\n  dict(\n    error='Unsupported mode requested: ' ~ _mode,\n
        \   mode=_mode\n  )\n}}\n"
  - stop: 'Unsupported mode requested: {{ _mode }}'
    response_variable: response
- stop: ''
  response_variable: response
