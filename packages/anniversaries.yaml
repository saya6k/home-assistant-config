      path: edwin_d/anniversary.yaml
      input:
        sensor_name: !secret anniversary_1_name
        special_date: !secret anniversary_1_date
        year_unknown: false
        calendar_entity: calendar.anniversaries
    unique_id: anniversary_1
  - use_blueprint:
      path: edwin_d/anniversary.yaml
      input:
        sensor_name: !secret anniversary_2_name
        special_date: !secret anniversary_2_date
        year_unknown: false
        calendar_entity: calendar.anniversaries
    unique_id: anniversary_2
  - use_blueprint:
      path: edwin_d/anniversary.yaml
      input:
        sensor_name: !secret anniversary_3_name
        special_date: !secret anniversary_3_date
        year_unknown: false
        calendar_entity: calendar.anniversaries
