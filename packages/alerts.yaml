---
homeassistant:
  customize:
    alert.ping_lost:
      friendly_name: '핑 오류'
      icon: mdi:network-off
    alert.unifi_site_seocho_offline:
      friendly_name: '서초 UniFi Network 오프라인'
      icon: mdi:network-off
    alert.unifi_site_gocheok_offline:
      friendly_name: '고척 Unifi Network 오프라인'
      icon: mdi:network-off

alert:
  ####################################################
  #                                                  #
  #                     Fatal                        #
  #                                                  #
  ####################################################

  ####################################################
  #                                                  #
  #                      Error                       #
  #                                                  #
  ####################################################

  ping_lost:
    name: Ping lost
    entity_id: binary_sensor.ping_google
    state: 'off'
    can_acknowledge: true
    skip_first: true
    title: Ping lost
    message: '현재 Google을 핑할 수 없습니다. 인터넷에 오류가 있는지 확인하세요.'
    done_message: clear_notification # 인터넷에 오류가 생겼다가 다시 복귀했습니다.
    repeat:
      - 5
      - 60
    notifiers:
      - mobile_app_ys_iphoneair
      # - persistent_notification
    data:
      notification_id: ping_lost
      tag: ping-lost
      push:
        interruption-level: time-sensitive

  unifi_site_gocheok_offline:
    name: UniFi site Gocheok Offline
    entity_id: sensor.gateway_pro_state
    state: 'disconnected'
    can_acknowledge: true
    skip_first: true
    title: 고척 UniFi Network 알림
    message: 고척 UniFi Network의 확인이 필요합니다.
    done_message: clear_notification # 고척 UniFi Network가 online으로 복귀했습니다.
    repeat:
      - 5
      - 60
    notifiers:
      - mobile_app_ys_iphoneair
      # - persistent_notification
    data:
      notification_id: unifi_site_gocheok_offline
      tag: unifi-site-gocheok-offline
      push:
        interruption-level: time-sensitive

  unifi_site_seocho_offline:
    name: UniFi site Seocho Offline
    entity_id: sensor.uxg_fiber_state
    state: 'disconnected'
    can_acknowledge: true
    skip_first: true
    title: 서초 UniFi Network 알림
    message: 서초 UniFi Network의 확인이 필요합니다.
    done_message: clear_notification # 서초 UniFi Network가 online으로 복귀했습니다.
    repeat:
      - 5
      - 60
    notifiers:
      - mobile_app_ys_iphoneair
      # - persistent_notification
    data:
      notification_id: unifi_site_seocho_offline
      tag: unifi-site-seocho-offline
      push:
        interruption-level: time-sensitive

  # front_door_open:
