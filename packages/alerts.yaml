  ####################################################
  #                                                  #
  #                     Warning                      #
  #                                                  #
  ####################################################

  study_interruption:
    name: 공부 시간!
    entity_id: binary_sensor.study_interruption
    state: 'on'
    repeat: 1
    can_acknowledge: true
    skip_first: true
    notifiers:
      - mobile_app_ys_macbook
    data:
      push:
        sound:
          name: default
        interruption-level: time-sensitive
      tag: study-interruption
    message: 공부시간에 컴퓨터는 학습목적으로만 합시다.
    title: 공부 시간!
    done_message: clear_notification

