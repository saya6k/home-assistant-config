          behavior: any
      sequence:
      - action: media_player.join
        target:
          area_id: living_room
        data:
          group_members:
          - media_player.hwajangsil
  - wait_for_trigger:
    - type: opened
      device_id: fc3dff62f88ea5860315237f6d739c8f
      entity_id: e3b9042bd9388f869d8db850a553c1ba
      domain: binary_sensor
      trigger: device
  - wait_for_trigger:
    - trigger: occupancy.cleared
      target:
        area_id: bathroom
