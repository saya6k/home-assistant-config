- id: '1717334579267'
  alias: HA Startup
  description: Notify and perform actions on HA startup
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: script.unknown_3
    metadata: {}
    data: {}
  - if:
    - condition: template
      value_template: '{{ todo_response[''returncode''] == 0 }}'
    then:
    - action: notify.send_message
      metadata: {}
      target:
        device_id: 0c78f2cfc8dc12193e6387be92be74e2
      data:
        message: '{{ todo_response[''stdout''] }}'
        title: ToDo
    else:
    - action: notify.send_message
      metadata: {}
      target:
        device_id: 0c78f2cfc8dc12193e6387be92be74e2
      data:
        message: '{{ todo_response[''stderr''] }}'
        title: ToDo file error
    enabled: false
  - if:
    - condition: zone.occupancy_is_detected
      options:
        for: 00:00:00
        zone: zone.home
    then:
    - if:
      - condition: alarm_control_panel.is_armed_away
        target:
          entity_id: alarm_control_panel.security_system
        options:
          behavior: any
      then:
      - action: scene.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: scene.welcome
        continue_on_error: true
    else:
    - action: scene.turn_on
      metadata: {}
      data: {}
      target:
        entity_id:
        - scene.away
      continue_on_error: true
  mode: single
- id: '1750997515323'
