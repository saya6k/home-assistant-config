- id: '1784562220878'
  alias: LG 기기 상태/오류 알림
  description: 여러 LG 기기(스타일러, 제습기, 에어컨)의 이벤트를 감지하여 상황에 맞는 상세 알림을 전송합니다.
  triggers:
  - trigger: event.received
    target:
      device_id:
      - 1100002c844ef7e5ac24ad4f66ceb1de
      - 9d212eec8632b078aee4da6b0df9ee34
      - cc28c4d8c86fe11e52a1544f0958b1a3
    options:
      event_type:
      - styling_is_complete
      - need_water_drain
      - water_leaks_error
      - door_close_error
      - door_open_error
      - need_water_replenishment
      - water_is_full
      - steam_heat_error
      - temperature_sensor_error
      - le_error
      - le2_error
      - error_has_occurred
  conditions: []
  actions:
  - variables:
      event_type: '{{ trigger.to_state.attributes.event_type | default('''') }}'
      friendly_name: '{{ trigger.to_state.attributes.friendly_name | default('''')
        }}'
  - action: script.message_broadcast
    data:
      message: "{% if event_type == '' %}\n  ⚠️ {{ friendly_name }}에서 알림이 발생했습니다.
        ThinQ 앱에서 자세한 내용을 확인하세요.\n\n{# ===================== 스타일러 =====================
        #} {% elif friendly_name == '스타일러 오류' %}\n\n  {% if event_type == 'styling_is_complete'
        %}\n  \U0001F454 스타일러 코스가 완료되었습니다.\n  옷을 꺼내 보관하면 구김과 습기를 최소화할 수 있습니다.\n\n
        \ {% elif event_type == 'need_water_replenishment' %}\n  \U0001F4A7 스타일러 급수통의
        물이 부족합니다.\n  깨끗한 물을 MAX 표시선까지 채운 후 다시 사용하세요.\n\n  {% elif event_type == 'need_water_drain'
        %}\n  \U0001F6B0 스타일러 배수통이 가득 찼습니다.\n  배수통을 비우고 다시 장착해 주세요.\n\n  {% elif event_type
        == 'door_open_error' %}\n  \U0001F6AA 스타일러 문이 열려 있습니다.\n  문을 완전히 닫은 후 다시 동작하세요.\n\n
        \ {% elif event_type == 'door_close_error' %}\n  ⚠️ 스타일러 문이 제대로 잠기지 않았습니다.\n
        \ 문 사이에 옷이 끼어 있지 않은지 확인한 후 다시 닫아주세요.\n\n  {% elif event_type == 'water_leaks_error'
        %}\n  \U0001F4A6 스타일러에서 누수 가능성이 감지되었습니다.\n  급수통·배수통이 올바르게 장착되어 있는지 확인하고, 계속
        발생하면 사용을 중지한 후 점검을 권장합니다.\n\n  {% elif event_type == 'steam_heat_error' %}\n
        \ ♨️ 스타일러 스팀 히터에 이상이 발생했습니다.\n  전원을 껐다가 다시 켜보고, 동일한 오류가 반복되면 서비스 점검이 필요합니다.\n\n
        \ {% elif event_type == 'temperature_sensor_error' %}\n  \U0001F321️ 스타일러
        온도 센서 오류입니다.\n  제품을 재시작해 보고, 동일 증상이 반복되면 점검을 권장합니다.\n\n  {% elif event_type
        == 'le_error' %}\n  ⚠️ 스타일러 LE 오류가 발생했습니다.\n  제품을 재시작한 후에도 계속 발생하면 서비스 점검을
        받아보세요.\n\n  {% elif event_type == 'le2_error' %}\n  ⚠️ 스타일러 LE2 오류가 발생했습니다.\n
        \ 내부 부품 이상 가능성이 있으므로 전원을 껐다가 다시 켠 후, 반복되면 서비스 점검을 권장합니다.\n\n  {% elif event_type
        == 'error_has_occurred' %}\n  ❌ 스타일러에서 오류가 발생했습니다.\n  ThinQ 앱 또는 제품 표시창의 오류
        코드를 확인해 주세요.\n\n  {% else %}\n  \U0001F4E2 스타일러 알림: {{ event_type }}\n\n  {%
        endif %}\n\n{# ===================== 제습기 ===================== #} {% elif
        friendly_name == '화장실 제습기 알림' %}\n\n  {% if event_type == 'water_is_full'
        %}\n  \U0001F4A7 제습기 물통이 가득 찼습니다.\n  물통을 비우고 다시 장착하면 제습이 재개됩니다.\n\n  {% elif
        event_type == 'door_open_error' %}\n  ⚠️ 제습기 물통 또는 커버가 제대로 장착되지 않았습니다.\n  다시
        확인해 주세요.\n\n  {% elif event_type == 'error_has_occurred' %}\n  ❌ 제습기에서 오류가
        발생했습니다.\n  제품 표시창 또는 ThinQ 앱에서 오류 내용을 확인하세요.\n\n  {% else %}\n  \U0001F4E2
        화장실 제습기 알림: {{ event_type }}\n\n  {% endif %}\n\n{# =====================
        에어컨 ===================== #} {% elif friendly_name == '에어컨 오류' %}\n\n  {%
        if event_type == 'temperature_sensor_error' %}\n  \U0001F321️ 에어컨 온도 센서 이상이
        감지되었습니다.\n  전원을 다시 켜보고 동일 증상이 반복되면 점검을 권장합니다.\n\n  {% elif event_type == 'le_error'
        %}\n  ⚠️ 에어컨 LE 오류가 발생했습니다.\n  일시적인 오류일 수 있으므로 전원을 재시작해 보세요.\n\n  {% elif
        event_type == 'le2_error' %}\n  ⚠️ 에어컨 LE2 오류가 발생했습니다.\n  반복될 경우 서비스 점검을 권장합니다.\n\n
        \ {% elif event_type == 'error_has_occurred' %}\n  ❌ 에어컨에서 오류가 발생했습니다.\n  ThinQ
        앱 또는 실내기 표시창의 오류 코드를 확인하세요.\n\n  {% else %}\n  \U0001F4E2 에어컨 알림: {{ event_type
        }}\n\n  {% endif %}\n\n{# ===================== 기타 ===================== #}
        {% else %}\n  \U0001F4E2 {{ friendly_name }}에서 '{{ event_type }}' 이벤트가 발생했습니다.\n{%
        endif %}"
  mode: single
- id: '1786454423919'
  alias: 침실 창문 한쪽만 닫힘 3분 알림
  description: 침실 창문 두 개 중 정확히 하나만 닫힌 상태가 3분 지속되면 안내
