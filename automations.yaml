        options:
          behavior: any
      - condition: window.is_closed
        target:
          device_id: 940271c084ed40a9b3a077bec76104a5
        options:
          behavior: any
  actions:
  - delay:
      minutes: 3
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: window.is_closed
        target:
          device_id: d23ec4087ffd2c62112afd77111482e7
        options:
          behavior: any
      - condition: window.is_open
        target:
          device_id: 940271c084ed40a9b3a077bec76104a5
        options:
          behavior: any
    - condition: and
      conditions:
      - condition: window.is_open
        target:
          device_id: d23ec4087ffd2c62112afd77111482e7
        options:
          behavior: any
      - condition: window.is_closed
        target:
          device_id: 940271c084ed40a9b3a077bec76104a5
        options:
