- id: '1792800000000'
  alias: 거실 옷장 문 열림 5분 알림
  description: 거실 옷장 문이 5분 이상 열려 있으면 닫을 때까지 30분마다 닫으라고 안내
  triggers:
  - trigger: door.opened
    target:
      device_id: 56743093202134d4d7e1c705d6292bb8
    options:
      behavior: each
      for:
        hours: 0
        minutes: 5
        seconds: 0
    id: 주 옷장
    variables:
      door_entity: binary_sensor.geosil_ju_osjang_door
  - trigger: door.opened
    target:
      device_id: c9ba2c9771a3ced352dbe56e6ca644d7
    options:
      behavior: each
      for:
        hours: 0
        minutes: 5
        seconds: 0
    id: 보조 옷장
    variables:
      door_entity: binary_sensor.geosil_bojo_osjang_door
  conditions: []
  actions:
  - repeat:
      sequence:
      - action: script.message_broadcast
        metadata: {}
        data:
          default_target:
            area_id: living_room
          message: 거실 {{ trigger.id }} 문이 열려 있습니다. 문을 닫아 주세요.
      - wait_template: '{{ is_state(door_entity, ''off'') }}'
        timeout: 00:30:00
        continue_on_timeout: true
      until:
      - condition: template
        value_template: '{{ wait.completed }}'
  mode: parallel
- id: '1792900000000'
  alias: 건조대 열림 시 제습기 빨래건조 모드
  description: 건조대가 열려 있고 창문이 모두 닫혀 있으며 화장실 문이 열려 있으면 제습기를 빨래건조 모드로 돌리고, 조건이 깨지면 원래
    모드로 되돌린 뒤 끕니다.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.jubang_geonjodae
    to:
    - 'on'
    - 'off'
  - trigger: state
    entity_id:
    - binary_sensor.hwajangsil_mun_door
    - binary_sensor.cimsil_baggat_cangmun
    - binary_sensor.cimsil_cimsil_cangmun
    to:
    - 'on'
    - 'off'
    for:
      minutes: 1
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.jubang_geonjodae
      state: 'on'
    - condition: state
      entity_id: binary_sensor.hwajangsil_mun_door
      state: 'on'
    - condition: state
      entity_id:
      - binary_sensor.cimsil_baggat_cangmun
      - binary_sensor.cimsil_cimsil_cangmun
      state: 'off'
    then:
    - action: humidifier.turn_on
      target:
        entity_id: humidifier.bathroom_dehumidifier
    - action: humidifier.set_mode
      target:
        entity_id: humidifier.bathroom_dehumidifier
      data:
        mode: intensive_dry
    else:
    - if:
      - condition: state
        entity_id: humidifier.bathroom_dehumidifier
        attribute: mode
        state: intensive_dry
      then:
      - action: humidifier.set_mode
        target:
          entity_id: humidifier.bathroom_dehumidifier
        data:
          mode: smart_humidity
      - action: humidifier.turn_off
        target:
          entity_id: humidifier.bathroom_dehumidifier
  mode: restart
