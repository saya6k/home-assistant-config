- id: '1783668487039'
  alias: 커피 머신 오류 알림 (종합)
  description: xBloom Studio 커피 머신에서 오류 이벤트가 감지되면 오류 원인과 해결 방법을 음성으로 브로드캐스트합니다.
  triggers:
  - trigger: event.received
    target:
      device_id:
      - ae17831b012e04dfd22581c6b4bd5f67
    options:
      event_type:
      - no_beans
      - abnormal_gear_position
      - abnormal_dose_or_water
      - water_shortage
      - dock_moving_error
      - grinding_error
      - brewing_error
      - mismatched_power
      - scale_overload
      - upgrade_failed
    id: generated--s6G
  - trigger: event.received
    target:
      device_id: ae17831b012e04dfd22581c6b4bd5f67
    options:
      event_type:
      - pour_complete
    id: generated-p6tL
  - trigger: event.received
    target:
      device_id: ae17831b012e04dfd22581c6b4bd5f67
    options:
      event_type:
      - pod_detected
    id: generated-0pZC
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - generated--s6G
      sequence:
      - variables:
          error_type: '{{ trigger.to_state.attributes.event_type }}'
          error_messages:
            no_beans: 커피 머신에 원두가 부족합니다. 원두통에 원두를 채워 주세요. 원두가 충분한데도 계속 발생하면 원두가 걸렸을
              수 있으니 분쇄기를 가볍게 두드려 원두를 풀어 준 뒤 다시 시도해 주세요.
            abnormal_gear_position: 커피 머신의 그라인더 위치 이상이 감지되었습니다. 분쇄기 내부에 이물질이나 걸린 원두가
              없는지 확인해 주세요. 필요하면 기기를 재시작한 후 다시 시도해 주세요.
            abnormal_dose_or_water: 원두 투입량 또는 물 공급에 문제가 있습니다. 원두가 정상적으로 공급되는지, 물탱크에
              충분한 물이 있는지 확인해 주세요. 필요하면 디스케일링을 실행한 후 다시 시도해 주세요.
            water_shortage: 커피 머신의 물이 부족합니다. 물통을 채워 주세요. 계속 발생하면 물 흡입구가 막히지 않았는지 확인하고
              필요하면 디스케일링을 실행해 주세요.
            dock_moving_error: 도크 이동 오류가 발생했습니다. 도크 주변에 장애물이 없는지 확인하고 주변을 깨끗하게 정리해
              주세요. 문제가 계속되면 전원을 30초 정도 분리한 후 다시 연결해 주세요.
            grinding_error: 분쇄 오류가 발생했습니다. 분쇄기에 이물질이나 걸린 원두가 없는지 확인해 주세요. 오른쪽 노브를
              빠르게 세 번 눌러 기기를 재시작한 뒤 분쇄기 보정을 수행하고 다시 시도해 주세요. 분쇄기를 연속으로 오래 사용했다면 잠시
              식힌 후 다시 사용해 주세요.
            brewing_error: 추출 오류가 발생했습니다. 물탱크와 급수 라인에 충분한 물이 있는지 확인해 주세요. 필요하면 디스케일링을
              실행한 후 다시 시도해 주세요.
            mismatched_power: 전원 공급이 올바르지 않습니다. 정품 전원 어댑터를 사용하고 현재 국가의 전압과 맞는지 확인해
              주세요. 동일한 전압이라면 다른 콘센트에 연결해 보세요.
            scale_overload: 스케일 과부하가 감지되었습니다. 스케일 위의 무게가 2킬로그램을 넘지 않도록 해 주세요. 문제가
              계속되면 스케일을 재보정해 주세요.
            upgrade_failed: 펌웨어 업그레이드에 실패했습니다. 휴대폰의 블루투스를 켠 상태에서 기기 가까이에 머물며 다시 시도해
              주세요. 업그레이드는 보통 2분에서 10분 정도 소요됩니다.
      - action: script.message_broadcast
        metadata: {}
        data:
          message: "{{ error_messages.get(\n  error_type,\n  '커피 머신에 오류가 발생했습니다. 기기의
            상태를 확인해 주세요.'\n) }}"
          default_target:
            area_id: kitchen
    - conditions:
      - condition: trigger
        id:
        - generated-p6tL
      sequence:
      - action: script.message_broadcast
        metadata: {}
        target: {}
        data:
          message: '{{ states(''select.jubang_xbloom_coffee_machine_recipe'') }} 레시피의
            추출이 완료되었습니다.'
          default_target:
            area_id: kitchen
      - wait_for_trigger:
        - trigger: event.received
          target:
            device_id:
            - ae17831b012e04dfd22581c6b4bd5f67
          options:
            event_type:
            - recipe_complete
        continue_on_timeout: false
      - action: script.message_broadcast
        metadata: {}
        target: {}
        data:
          message: 맛있게 드세요!
          default_target:
            area_id: kitchen
    - conditions:
      - condition: trigger
        id:
        - generated-0pZC
      sequence:
      - action: script.message_broadcast
        metadata: {}
        target: {}
        data:
          message: 새로운 팟의 레시피가 감지되었습니다.
          default_target:
            area_id: kitchen
  mode: single
