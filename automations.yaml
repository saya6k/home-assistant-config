- id: '1762605042798'
  alias: 17TRACK 택배 알림
  description: 센서 값이 업데이트되면 17TRACK에서 택배 정보를 조회하고 알림 생성
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - sensor.17track_in_transit
    - sensor.17track_alert
    - sensor.17track_delivered
    - sensor.17track_expired
    - sensor.17track_undelivered
    - sensor.17track_not_found
    - sensor.17track_ready_to_be_picked_up
    not_from: unavailable
    not_to: unavailable
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: template
    value_template: "{{ expand([\n  'sensor.17track_in_transit',\n  'sensor.17track_alert',\n
      \ 'sensor.17track_delivered',\n  'sensor.17track_expired',\n  'sensor.17track_undelivered',\n
      \ 'sensor.17track_not_found',\n  'sensor.17track_ready_to_be_picked_up'\n])
      | selectattr('state','is_number') | map(attribute='state') | map('int') | sum
      > 0 }}\n"
  actions:
  - action: seventeentrack.get_packages
    data:
      config_entry_id: 01JYMYFVHJ5ZHF1Y8DVE1CCDQB
    response_variable: packages
  - repeat:
      for_each: '{{ packages.packages }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ repeat.item.status == ''Delivered'' }}'
        then:
        - action: persistent_notification.create
          data:
            title: "\U0001F4E6\U0001F389 {{ repeat.item.friendly_name | default('이름
              없음') }} — 배송 완료\n"
            notification_id: 17track_delivered_{{ repeat.item.tracking_number }}
            message: "### \U0001F4E6 {{ repeat.item.friendly_name | default('이름 없음')
              }}\n> **상태:** 배송 완료 \U0001F389  \n> **위치:** {{ repeat.item.location
              | default('정보 없음') }}\n{% set ts = repeat.item.timestamp %} > **업데이트:**
              \  {% if ts %} > {{ as_local(as_datetime(ts)).strftime(\"%Y. %m. %-d.
              %H:%M\") }} {% else %} > 정보 없음 {% endif %}\n> **송장번호:** `{{ repeat.item.tracking_number
              | default('-') }}`  \n> **출발국가:** {{ repeat.item.origin_country | default('-')
              }}  \n> **도착국가:** {{ repeat.item.destination_country | default('-')
              }}\n> **최신 정보:**   > {{ repeat.item.info_text | default('정보 없음') }}\n"
        - action: seventeentrack.archive_package
          data:
            config_entry_id: 01JYMYFVHJ5ZHF1Y8DVE1CCDQB
            package_tracking_number: '{{ repeat.item.tracking_number }}'
  - if:
    - condition: template
      value_template: '{{ packages.packages | selectattr(''status'', ''ne'', ''Delivered'')
        | list | count > 0 }}

        '
    then:
    - action: persistent_notification.create
      data:
        title: "\U0001F4E6 17TRACK 택배 현황"
        notification_id: 17track_summary
        message: "**\U0001F69A 배송 중인 택배**\n{% for pkg in packages.packages | default([])
          %}\n  {% if pkg.status | default('') != 'Delivered' %}\n\n### \U0001F4E6
          {{ pkg.friendly_name | default('이름 없음') }}\n> **상태:** {{ pkg.status | default('정보
          없음') }}  \n> **위치:** {{ pkg.location | default('정보 없음') }}\n{% set ts =
          pkg.timestamp %} > **업데이트:**   {% if ts %} > {{ as_local(as_datetime(ts)).strftime(\"%Y.
          %m. %-d. %H:%M\") }} {% else %} > 정보 없음 {% endif %}\n> **송장번호:** `{{ pkg.tracking_number
          | default('-') }}`  \n> **출발국가:** {{ pkg.origin_country | default('-') }}
          \ \n> **도착국가:** {{ pkg.destination_country | default('-') }}\n> **최신 정보:**
          \  > {{ pkg.info_text | default('정보 없음') }}\n> [보관하기](homeassistant://call_service/seventeentrack.archive_package?config_entry_id=01JYMYFVHJ5ZHF1Y8DVE1CCDQB&package_tracking_number={{
          pkg.tracking_number | urlencode }})\n---\n  {% endif %}\n{% endfor %}\n"
    else:
    - action: persistent_notification.dismiss
      data:
        notification_id: 17track_summary
  mode: single
- id: '1762935300497'
  alias: 이메일 수신 시 운송장 번호 추출 및 트래킹 추가
  description: 새 이메일 도착 시 제목에서 운송장 번호를 추출하고 17TRACK에 해당 패키지 정보를 추가합니다.
  triggers:
  - trigger: event
    event_type: imap_content
    event_data:
      entry_id: 01J3N0S0BG2H4BEY3RB6FF04ZM
  conditions:
  - condition: numeric_state
    entity_id: sensor.imap_receipt
    above: 0
  actions:
  - action: imap.fetch
    metadata: {}
    data:
      entry: 01J3N0S0BG2H4BEY3RB6FF04ZM
      uid: '{{ trigger.event.data.uid }}'
    response_variable: fetch
  - if:
    - condition: template
      value_template: '{# Check for delivered phrases in the subject #} {% set subject
        = trigger.event.data.subject %} {# Use double quotes around "we''ve delivered"
        to avoid syntax error #} {{ ''배송'' in subject or ''발송'' in subject or ''결제''
        in subject or ''주문'' in subject}}'
    then:
    - action: ai_task.generate_data
      metadata: {}
      data:
        instructions: 'New email arrived: ''{{ fetch.subject }} by ''{{ fetch.sender
          }}''.

          {{ fetch.text }}

          Is this mail about tracking number? If true, Find package content tracking
          number from email and fill in the tracking number. For package name, insert
          shopping mall name + date with YYYYMMDD format.'
        task_name: Tracking Number
        structure:
          true_or_false:
            selector:
              boolean:
          package_name:
            selector:
              text:
          tracking_number:
            selector:
              text:
      response_variable: result
    - if:
      - condition: template
        value_template: '{{ result.data.true_or_false }}'
      then:
      - action: seventeentrack.add_package
        data:
          config_entry_id: 01JYMYFVHJ5ZHF1Y8DVE1CCDQB
          package_tracking_number: '{{ result.data.tracking_number }}

            '
          package_friendly_name: '{{ result.data.package_name }}

            '
      - metadata: {}
        data:
          message: '## {{ result.data.package_name }}


            새로 발송된 위 택배를 17TRACK에 추가하였습니다.


            보낸 사람 - {{ trigger.event.data[''sender''] }}


            송장번호: {{ result.data.tracking_number }}'
          title: 택배 발송 알림 - {{ result.data.package_name }}
        action: notify.mobile_app_ys_iphoneair
        enabled: true
  - action: ai_task.generate_data
    metadata: {}
    data:
      instructions: 'New email arrived: ''{{ fetch.subject }} by ''{{ fetch.sender
        }}''.

        {{ fetch.text }}

        Is this mail type about ''package'' tracking or ''receipt'' from purchase?'
      structure:
        type:
          selector:
            text:
        package_name:
          selector:
            text:
        tracking_number:
          selector:
            text:
      task_name: Email Classification
    response_variable: result
    enabled: false
  - choose:
    - conditions: []
      sequence: []
    enabled: false
  mode: queued
