- id: '1717334579267'
  alias: HA Startup
  description: Notify and perform actions on HA startup
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: script.unknown
    metadata: {}
    data: {}
  - if:
    - condition: template
      value_template: '{{ todo_response[''returncode''] == 0 }}'
    then:
    - action: notify.mobile_app_ys_iphone13
      data:
        title: ToDo
        message: '{{ todo_response[''stdout''] }}'
    else:
    - action: notify.mobile_app_ys_iphone13
      data:
        title: ToDo file error
        message: '{{ todo_response[''stderr''] }}'
    enabled: false
  - if:
    - condition: numeric_state
      entity_id: zone.home
      above: 0
    then:
    - if:
      - condition: state
        entity_id: alarm_control_panel.security_system
        state:
        - armed_away
      then:
      - action: scene.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: scene.welcome
    else:
    - action: scene.turn_on
      metadata: {}
      data: {}
      target:
        entity_id:
        - scene.away
  - action: readme.generate
    metadata: {}
    data:
      convert_lovelace: true
  mode: single
- id: '1739462792155'
  alias: Notify Seoul Teukbo
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.seoul_teukbo_gust_alert
    - sensor.seoul_teukbo_cold_alert
    - sensor.seoul_teukbo_downpour_alert
    - sensor.seoul_teukbo_dry_alert
    - sensor.seoul_teukbo_dust_alert
    - sensor.seoul_teukbo_heat_alert
    - sensor.seoul_teukbo_snow_alert
    - sensor.seoul_teukbo_typhoon_alert
