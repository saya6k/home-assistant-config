- id: '1714009521553'
  alias: ESPHome Auto-Update
  description: 'Trigger: The automation triggers when any ESPHome device is marked
    as ''on'' for an update.

    Action: Once triggered, it calls script esphome_update_all_devices, which starts
    the update process for each device.

    Mode: Like the script, it’s set to ''single'' to handle updates one by one.'
  triggers:
  - trigger: state
    entity_id:
    - update.esphome_update
    from:
    - 'on'
    to:
    - 'off'
  conditions: []
  actions:
  - repeat:
      for_each: '{{ states.update | selectattr(''state'', ''eq'', ''on'') | map(attribute=''entity_id'')
        | select(''in'', integration_entities(''esphome'')) | list }} '
      sequence:
      - action: update.install
        metadata: {}
        target:
          entity_id: '{{ repeat.item }}'
        data: {}
      - wait_template: '{{ is_state(repeat.item, ''off'') }}'
        continue_on_timeout: true
  mode: single
- id: '1717333060399'
  alias: Washer State On
