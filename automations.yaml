- id: '1751020560204'
  alias: Notify Personal Agenda
  description: ''
  triggers:
  - trigger: zone
    entity_id: person.weongyu
    zone: zone.home
    event: enter
  conditions: []
  actions:
  - action: todo.get_items
    metadata: {}
    data:
      status: needs_action
    target:
      entity_id: todo.chore
    response_variable: today_todos
  - action: persistent_notification.create
    metadata: {}
    data:
      title: "\U0001F3E1 집에서 할 일이에요"
      message: "{% set due_items = today_todos['todo.chore']['items']
        | selectattr('due', 'defined') | list %} {%\n  set no_due_items = today_todos['todo.chore']['items']
        | rejectattr('due', 'defined') | list %}\n  {% if due_items | length > 0 %}\n
        \ ### 오늘의 할일은 다음과 같아요:\n  \n  {% for item in due_items %}\n    - **{{ item.summary
        }}**: {{ item.description }}\n    \n  {% endfor %}\n  {% else %}  \n    ###
        오늘 남은 할 일은 없네요.\n  {% endif %}\n  {% if no_due_items | length > 0 %}   ###
        그 외 할일이에요:\n  \n  {% for item in no_due_items %}   \n    - **{{ item.summary
        }}**: {{ item.description }}\n  {% endfor %}\n  {% endif %}\n"
      notification_id: agenda_home
    enabled: false
  - action: notify.send_message
    metadata: {}
    target:
      device_id: 0c78f2cfc8dc12193e6387be92be74e2
    data:
      message: '{% set due_items = today_todos[''todo.chore''][''items''] | selectattr(''due'',
        ''defined'') | list %} {% set no_due_items = today_todos[''todo.chore''][''items'']
        | rejectattr(''due'', ''defined'') | list %} {% if due_items | length > 0
        %}   오늘의 할일: {{ due_items | length }}개 {% endif %} {% if no_due_items | length
        > 0 %}   그 외 할일: {{ no_due_items | length }}개 {% endif %}'
      title: "Welcome Back to Home \U0001F3E1"
      data:
        subtitle:
        url: /todo?entity_id=todo.chore
        push:
          interruption-level: active
  mode: single
- id: '1751025981451'
  alias: Notify Study Interruption
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.ys_macbook_frontmost_app
    from: 한컴오피스 한글
    to:
  - trigger: state
    entity_id:
    - sensor.ys_macbook_frontmost_app
    from: 고시닷컴
    to:
  - trigger: schedule.block_started
    target:
      entity_id: schedule.study_period
    options:
      behavior: each
      for: 00:00:00
  conditions:
  - condition: state
    entity_id: calendar.saya6k_me_com_personal
    state:
    - 'off'
  - condition: zone
    entity_id: person.weongyu
    zone: zone.academy
  - condition: or
    conditions:
    - condition: template
      value_template: '{{ not states(''sensor.ys_macbook_frontmost_app'').startswith(''한컴오피스
        한글'') }}'
    - condition: template
      value_template: '{{ not states(''sensor.ys_macbook_frontmost_app'').startswith(''고시닷컴'')
        }}'
    - condition: template
      value_template: '{{ not states(''sensor.ys_macbook_frontmost_app'').startswith(''Safe
        Exam Browser'') }}'
  actions:
  - action: notify.mobile_app_ys_macbook
    metadata: {}
    data:
      data:
        tag: study-interruption
      message: clear_notification
  - repeat:
      sequence:
      - delay:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
      - action: notify.mobile_app_ys_macbook
        metadata: {}
        data:
          data:
            push:
              sound:
                name: default
              interruption-level: time-sensitive
            tag: study-interruption
          message: 공부시간에 컴퓨터는 학습목적으로만 합시다.
          title: 공부 시간!
      until:
      - condition: or
        conditions:
        - condition: template
          value_template: '{{ states(''sensor.ys_macbook_frontmost_app'').startswith(''고시닷컴'')
            }}'
        - condition: template
          value_template: '{{ states(''sensor.ys_macbook_frontmost_app'').startswith(''한컴오피스
            한글'') }}'
        - condition: template
          value_template: '{{ states(''sensor.ys_macbook_frontmost_app'').startswith(''Safe
            Exam Browser'') }}'
        - condition: not
          conditions:
          - condition: schedule.is_on
            target:
              entity_id: schedule.study_period
            options:
              for: 00:00:00
  - action: notify.mobile_app_ys_macbook
    metadata: {}
    data:
      message: clear_notification
      data:
        tag: study-interruption
  mode: restart
- id: '1753928991880'
  alias: 핫 세일 알림 (위시리스트 체크)
  description: 핫 세일 상품을 위시리스트에 대응하여 알림을 전송합니다. 이 자동화는 세일 상품이 위시리스트에 있는 경우에만 알림을 제공합니다.
  triggers:
  - trigger: event.received
    target:
      device_id:
      - c6efb9f25a7af21457edd138bf451c88
      - c6c5f4e346a9b934733cd9b989e72ce9
      - 0e4df89e2eecf1c0a2cb2eef59688130
      - e0af9c16a3b589d7fe4706ced15cf5c4
      - 03c604ad99cff3f05f503e71eac5fbd6
    options:
      event_type:
      - feedreader
  conditions: []
  actions:
  - target:
      entity_id:
      - todo.shopping_list
    data:
      status: needs_action
    response_variable: my_wish_list
    action: todo.get_items
  - action: ai_task.generate_data
    metadata: {}
    data:
      instructions: "이 메시지는 핫 세일로 받은 알림입니다. **{{ trigger.to_state.attributes.title
        }}**:\n{% if 'description' in trigger.to_state.attributes %}\n  {{ trigger.to_state.attributes.description
        if trigger.to_state.attributes.description != \"\" else 'N/A' }}\n{% else
        %}\n  N/A\n{% endif %}\n\n위 상품이 아래 나의 위시리스트에 있는 항목과 일치하는 경우, 내게 알려줘야 합니다.\n\n{%
        for item in my_wish_list['todo.shopping_list']['items'] %}\n  -
        **{{ item.summary }}**:\n  {% if 'description' in item %}\n    {{ item.description
        if item.description != \"\" else 'N/A' }}\n  {% else %}\n    N/A\n  {% endif
        %}\n{% endfor %}\n\n이 메시지에 포함된 상품이 내 위시리스트에 있는 상품인가요?"
      task_name: Hot Sale
      structure:
        true_or_false:
          selector:
            boolean:
    response_variable: result
  - if:
    - condition: template
      value_template: '{{ result.data.true_or_false }}'
    then:
    - action: notify.send_message
      metadata: {}
      target:
        entity_id: notify.ys_iphoneair
      data:
        message: "{{ trigger.to_state.attributes.description\n   | default(trigger.to_state.attributes.title,
          true)\n   | default('위시리스트 상품 세일 알림', true) }}"
        title: '{{ trigger.to_state.attributes.friendly_name | default(''핫 세일'', true)
          }}'
        data:
          subtitle: '{{ trigger.to_state.attributes.title | default('''', true) }}'
          url: '{{ trigger.to_state.attributes.link | default('''', true) }}'
          push:
            interruption-level: critical
  mode: parallel
  max: 100
- id: '1753930331307'
  alias: 침대에서 침대에 누워 있다고 알림
  description: 침대에 누워 있고, 집이 일정 조건을 충족할 때 조명과 음악으로 편안한 환경 조성
  triggers:
  - device_id: 419d5d6b862b27f2bb578347034b714e
    entity_id: cb88873a76e543713c95bdc11ba9a391
    domain: binary_sensor
    type: occupied
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: device
  conditions:
  - condition: alarm_control_panel.is_armed_home
    target:
      entity_id: alarm_control_panel.security_system
    options:
      for: 00:00:00
  - condition: sun.is_up
    options: {}
  - condition: zone.occupancy_is_detected
    options:
      for: 00:00:00
      zone: zone.home
  actions:
  - action: assist_satellite.ask_question
    metadata: {}
    data:
      question: '{% set people = states.person | selectattr("state", "equalto", "home")
        | list %} {% set count = people | count %} {% if count == 1 %}   {{ people[0].attributes.friendly_name
        }}님, 지금 침대에 누워 계신 것 같아요. {%if is_state(''binary_sensor.night'',''on'')%}취침{%else%}취침{%endif%}
        장면을 활성화할까요? {% elif count > 1 %}   {{ people | map(attribute=''attributes.friendly_name'')
        | join(''님, '') }} 님, 침대에 누워 계신 것 같아요. {%if is_state(''binary_sensor.night'',''on'')%}취침{%else%}취침{%endif%}
        장면을 활성화할까요? {% endif %}'
      preannounce: true
      answers:
      - id: 'yes'
        sentences:
        - 예
        - 네
        - 그래
        - 응
        - 오케이
    response_variable: answer
  - if:
    - condition: template
      value_template: '{{ answer.id == ''yes'' }}'
    then:
    - action: scene.turn_on
      metadata: {}
      target:
        entity_id: scene.sleep
      data: {}
    - action: script.turn_on
      metadata: {}
      target:
        entity_id: script.sleep_as_android_start_sleep_tracking
      data: {}
  mode: single
- id: '1753958558668'
  alias: 새 이메일 도착 알림
  description: 새 메일은 개별 persistent notification 생성, inbox가 비면 전체 알림 정리
  triggers:
  - trigger: event
    event_type: imap_content
    id: new_mail
  - trigger: state
    entity_id: sensor.imap_inbox
    to: '0'
    id: inbox_empty
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: new_mail
      - condition: numeric_state
        entity_id: sensor.imap_inbox
        above: 0
      sequence:
      - variables:
          raw_sender: '{{ trigger.event.data.get(''sender'', '''') }}'
          sender_name: "{% if '<' in raw_sender %}\n  {{ raw_sender.split('<')[0].strip().strip('\"')
            }}\n{% else %}\n  {{ raw_sender }}\n{% endif %}"
          sender_email: "{% if '<' in raw_sender and '>' in raw_sender %}\n  {{ raw_sender.split('<')[1].split('>')[0].strip()
            }}\n{% else %}\n  {{ raw_sender }}\n{% endif %}"
          subject: '{{ trigger.event.data.get(''subject'', ''제목 없음'') }}'
          mail_uid: '{{ trigger.event.data.get(''uid'', now().timestamp() | int) }}'
      - action: persistent_notification.create
        data:
          title: '{{ subject }}'
          message: '{{ subject }} by [{{ sender_name }}](mailto:{{ sender_email }})'
          notification_id: email_{{ mail_uid }}
    - conditions:
      - condition: trigger
        id: inbox_empty
      sequence:
      - action: persistent_notification.dismiss_all
  mode: queued
- id: '1754101632706'
  alias: TTS 캐시 지우기
  description: 매일 오전 1시에 TTS 캐시를 지웁니다.
  triggers:
  - trigger: time
