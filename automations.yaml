- id: '1751020435496'
  alias: Notify Work Agenda
  description: ''
  triggers:
  - trigger: zone
    entity_id: person.weongyu
    zone: zone.academy
    event: enter
  conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: 'on'
  actions:
  - action: calendar.get_events
    metadata: {}
    data:
      start_date_time: '{{ now().strftime(''%Y-%m-%d 00:00:00'') }}'
      end_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d 00:00:00'')
        }}'
    target:
      entity_id:
      - calendar.saya6k_me_com_study
    response_variable: today_events
  - action: notify.send_message
    metadata: {}
