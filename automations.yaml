- id: '1758255410861'
  alias: 샤워 시 플레이리스트 재생
  description: 거실에서 음악이 재생 중이면 화장실 스피커를 함께 재생하고, 나오면 화장실 스피커만 그룹에서 제외합니다.
  triggers:
