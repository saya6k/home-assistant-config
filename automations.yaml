  - variables:
      event_type: '{{ trigger.to_state.state }}'
      warning_type: '{{ state_attr(trigger.entity_id, ''warning_type'') }}'
      label: '{{ state_attr_translated(trigger.entity_id, ''event_type'') }}'
      start_time: '{{ state_attr(trigger.entity_id, ''start_time'') }}'
      end_time: '{{ state_attr(trigger.entity_id, ''end_time'') }}'
      icon: "{% if warning_type == '폭염' %}\U0001F975 {% elif warning_type == '호우'
        %}\U0001F327️ {% elif warning_type == '태풍' %}\U0001F300 {% elif warning_type
        == '강풍' %}\U0001F4A8 {% elif warning_type == '대설' %}❄️ {% elif warning_type
        == '한파' %}\U0001F976 {% elif warning_type == '건조' %}\U0001F525 {% elif warning_type
        == '풍랑' %}\U0001F30A {% elif warning_type == '지진해일' %}\U0001F30A {% elif warning_type
        == '황사' %}\U0001F32B️ {% else %}⚠️ {% endif %}\n"
      advice: "{% if warning_type == '폭염' %} \U0001F4A7 충분한 수분을 섭취하고 ☀️ 낮 시간대 야외활동을
        자제하세요. {% elif warning_type == '호우' %} \U0001F327️ 저지대와 하천 주변 접근을 피하세요. \U0001F697
        침수된 도로는 우회하세요. {% elif warning_type == '태풍' %} \U0001F300 외출을 자제하고 \U0001FA9F
        창문과 시설물을 점검하세요. {% elif warning_type == '강풍' %} \U0001F4A8 낙하물에 주의하고 \U0001FAB4
        야외 물건을 고정하세요. {% elif warning_type == '대설' %} ❄️ 미끄럼 사고에 유의하고 \U0001F697 차량은
        감속 운행하세요. {% elif warning_type == '한파' %} \U0001F976 보온에 신경 쓰고 \U0001F6B0
        수도 동파를 예방하세요. {% elif warning_type == '건조' %} \U0001F525 화기 사용에 각별히 주의하세요.
        {% elif warning_type == '풍랑' %} \U0001F30A 해안과 방파제 접근을 자제하세요. {% elif warning_type
        == '황사' %} \U0001F637 외출 시 마스크를 착용하세요. {% else %} 안전에 유의하세요. {% endif %}\n"
      interruption_level: "{% if event_type in ['warning','pre_warning'] %}\n  critical\n{%
        elif event_type in ['advisory','pre_advisory'] %}\n  time-sensitive\n{% else
        %}\n  active\n{% endif %}\n"
      message: "{{ icon }} {{ warning_type }} {{ label }}\n{% if event_type == 'warning'
        %} \U0001F6A8 {{ warning_type }} 경보가 발효되었습니다. {% elif event_type == 'advisory'
        %} {{ warning_type }} 주의보가 발효되었습니다. {% elif event_type == 'pre_warning' %}
        \U0001F6A8 {{ warning_type }} 경보가 곧 발효됩니다. {% elif event_type == 'pre_advisory'
        %} {{ warning_type }} 주의보가 곧 발효됩니다. {% elif event_type == 'cancelled' %} ✅
        {{ warning_type }} 특보가 해제되었습니다. {% endif %}\n{% if event_type != 'cancelled'
        %} {{ advice }} {% endif %}\n{% if start_time %} \U0001F552 시작: {{ as_timestamp(start_time)
        | timestamp_custom('%Y년 %m월 %d일 %H:%M') }} {% endif %}\n{% if end_time %}
        \U0001F553 종료: {{ as_timestamp(end_time) | timestamp_custom('%Y년 %m월 %d일 %H:%M')
        }} {% endif %}\n"
  - if:
    - condition: zone.occupancy_is_detected
      options:
        for: 00:00:00
        zone: zone.home
    then:
    - action: script.message_broadcast
      data:
        message: '{{ message }}'
        default_target:
          area_id: living_room
  - if:
    - condition: zone.not_in_zone
      target:
        entity_id:
        - person.weongyu
      options:
        for: 00:00:00
        zone: zone.home
        behavior: any
    then:
    - action: notify.mobile_app_ys_iphoneair
      data:
        title: 기상 특보
        message: '{{ message }}'
        data:
          subtitle: '{{ warning_type }} {{ label }}'
          push:
            interruption-level: '{{ interruption_level }}'
  mode: single
