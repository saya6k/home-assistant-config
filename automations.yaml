  - trigger: event
    event_type: imap_content
    event_data:
      folder: _RECEIPT
  conditions:
  - condition: numeric_state
    entity_id: sensor.imap_receipt
    above: 0
  - condition: template
    value_template: '{# Check for delivered phrases in the subject #} {% set subject
      = trigger.event.data.subject %} {# Use double quotes around "we''ve delivered"
      to avoid syntax error #} {{ ''배송'' in subject or ''발송'' in subject or ''결제''
      in subject or ''주문'' in subject}}'
  - condition: template
    value_template: '{% set folder = trigger.event.data.folder | lower %} {{ ''_receipt''
      == folder}}'
  actions:
  - action: ai_task.generate_data
    metadata: {}
    data:
      instructions: 'New email arrived: ''{{ trigger.event.data[''subject''] }} by
        ''{{ trigger.event.data[''sender''] }}''.

        {{ trigger.event.data[''text''] }}

        Is this mail about tracking number? If true, Find package content tracking
        number from email and answer.'
      task_name: Tracking Number
      structure:
        true_or_false:
          selector:
            boolean:
        package_name:
          selector:
            text:
        tracking_number:
          selector:
            text:
    response_variable: result
  - if:
    - condition: template
      value_template: '{{ result.data.true_or_false }}'
    then:
    - action: seventeentrack.add_package
      data:
        config_entry_id: 01JYMYFVHJ5ZHF1Y8DVE1CCDQB
        package_tracking_number: '{{ result.data.tracking_number }}

          '
        package_friendly_name: '{{ result.data.package_name }}

          '
    - metadata: {}
      data:
        message: '## {{ result.data.package_name }}


          새로 발송된 위 택배를 17TRACK에 추가하였습니다.


          보낸 사람 - {{ trigger.event.data[''sender''] }}


          송장번호: {{ result.data.tracking_number }}'
        title: 택배 발송 알림 - {{ result.data.package_name }}
      action: notify.mobile_app_ys_iphone13
      enabled: true
  mode: queued
