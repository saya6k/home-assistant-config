      entity_id: input_datetime.sleep
      offset: -00:30:00
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: zone
        entity_id: person.weongyu
        zone: zone.home
      - condition: alarm_control_panel.is_armed_home
        target:
          entity_id: alarm_control_panel.security_system
        options: {}
      sequence:
      - action: script.unknown
        metadata: {}
        data: {}
      - action: light.turn_on
        metadata: {}
