- id: '1764024028848'
  alias: 스팀 위시리스트 세일 알림
  description: 스팀 위시리스트에 등록된 항목이 세일에 들어가면 알림을 보냅니다(영구 알림).
  triggers:
  - type: value
    device_id: 1cb7637e2a6814b9c986ed4c0e235a49
    entity_id: 85638522cb0244eb4795b17b75544149
    domain: sensor
    trigger: device
    above: 0
  - trigger: state
    entity_id:
    - sensor.steam_wishlist_76561198124495822
    attribute: on_sale
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state.state != trigger.to_state.state }}

      '
  actions:
  - repeat:
      for_each: "{{ states | selectattr('domain', 'equalto', 'binary_sensor') \n  |
        selectattr('entity_id', 'search', 'binary_sensor.steam_wishlist_')\n  | map(attribute='entity_id')
        | list }}\n"
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(repeat.item, ''True'') }}'
        then:
        - data:
            title: "\U0001F3AE {{ state_attr(repeat.item, 'title') }} {{ state_attr(repeat.item,
              'normal_price') }} → {{ state_attr(repeat.item, 'sale_price') }} ({{
              state_attr(repeat.item, 'percent_off') }}% 할인)"
            message: '{{ state_attr(repeat.item, ''price'') }}


              [![Poster]({{ state_attr(repeat.item, ''poster'') }})]({{ state_attr(repeat.item,
              ''deep_link'') }})'
            notification_id: steam_{{ repeat.item | md5 }}
          action: persistent_notification.create
        else:
        - action: persistent_notification.dismiss
          metadata: {}
          data:
            notification_id: steam_{{ repeat.item | md5 }}
  mode: parallel
