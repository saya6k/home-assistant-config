# Mirror: pure black so the two-way mirror stays reflective; only white text shows through.
# Applied per view (`theme: Mirror`) on the living-room mirror dashboard (dashboard-test).

Mirror:
  primary-background-color: '#000000'
  secondary-background-color: '#000000'
  lovelace-background: '#000000'
  card-background-color: '#000000'
  ha-card-background: transparent
  ha-card-border-width: 0
  ha-card-box-shadow: none
  primary-text-color: '#ffffff'
  secondary-text-color: '#bdbdbd'
  disabled-text-color: '#616161'
  divider-color: transparent
  primary-color: '#ffffff'
  accent-color: '#ffffff'
  state-icon-color: '#ffffff'
  paper-item-icon-color: '#ffffff'
  app-header-background-color: '#000000'
  app-header-text-color: '#ffffff'
  app-header-border-bottom: none
  sidebar-background-color: '#000000'
  sidebar-text-color: '#ffffff'
  sidebar-icon-color: '#ffffff'
  weather-icon-sun-color: '#ffffff'
  weather-icon-moon-color: '#ffffff'
  weather-icon-cloud-front-color: '#ffffff'
  weather-icon-cloud-back-color: '#9e9e9e'
  weather-icon-rain-color: '#bdbdbd'
  weather-icon-snow-color: '#ffffff'
  weather-icon-snow-stroke-color: '#000000'
  ha-view-footer-box-shadow: none
