  - action: ai_task.generate_data
    metadata: {}
    data:
      attachments:
        media_content_id: media-source://camera/camera.baengbaeng_junction
        media_content_type: application/vnd.apple.mpegurl
        metadata:
          title: 뱅뱅사거리
          thumbnail: /api/camera_proxy/camera.baengbaeng_junction
          media_class: video
          children_media_class:
          navigateIds:
          - {}
          - media_content_type: app
            media_content_id: media-source://camera
      task_name: Traffic cameras
      instructions: '이건 사무실로 가는 길의 CCTV 영상이야.


        현재 차로 길이 막혀서 교통에 지장이 있는 중이면 true로 답해.'
      structure:
        true_or_false:
          selector:
            boolean:
    response_variable: traffic_jam
  alias: '교통 카메라: 교통 체증 여부 확인'
  description: 공개 교통 카메라를 통해 경로의 교통 체증 여부를 확인합니다.
imap:
  alias: IMAP 이메일 본문 디코딩
  sequence:
  - variables:
      email_sender: '{{ trigger.event.data.sender }}'
      email_subject: '{{ trigger.event.data.subject }}'
      email_date: '{{ trigger.event.data.date }}'
      email_uid: '{{ trigger.event.data.uid }}'
      raw_content: '{{ trigger.event.data.parts[''0''].content | default(''No content'')
        }}'
      content_type: '{{ trigger.event.data.parts[''0''].content_type }}'
      encoding: '{{ trigger.event.data.parts[''0''].content_transfer_encoding }}'
      decoded_content: '{% set content = trigger.event.data.parts[''0''].content |
        default('''') %} {# Replace common quoted-printable sequences #} {% set content
        = content | replace(''=\n'', '''') %} {% set content = content | replace(''=\r\n'',
        '''') %} {% set content = content | replace(''=20'', '' '') %} {% set content
        = content | replace(''=3D'', ''='') %} {% set content = content | replace(''=2E'',
        ''.'') %} {% set content = content | replace(''=2C'', '','') %} {% set content
        = content | replace(''=3A'', '':'') %} {% set content = content | replace(''=3B'',
        '';'') %} {% set content = content | replace(''=3F'', ''?'') %} {% set content
        = content | replace(''=21'', ''!'') %} {% set content = content | replace(''=22'',
        ''"'') %} {% set content = content | replace(''=27'', "''") %} {% set content
        = content | replace(''=28'', ''('') %} {% set content = content | replace(''=29'',
        '')'') %} {% set content = content | replace(''=2D'', ''-'') %} {% set content
        = content | replace(''=2F'', ''/'') %} {% set content = content | replace(''=3C'',
        ''<'') %} {% set content = content | replace(''=3E'', ''>'') %} {% set content
        = content | replace(''=40'', ''@'') %} {% set content = content | replace(''=5B'',
        ''['') %} {% set content = content | replace(''=5D'', '']'') %} {% set content
        = content | replace(''=0D=0A'', ''\n'') %} {% set content = content | replace(''=0A'',
        ''\n'') %} {% set content = content | replace(''=09'', ''\t'') %} {{ content
        }}

        '
      plain_text: '{% set text = decoded_content %} {% set text = text | regex_replace(''<[^>]+>'',
        '''') %} {% set text = text | regex_replace(''&nbsp;'', '' '') %} {% set text
        = text | regex_replace(''&amp;'', ''&'') %} {% set text = text | regex_replace(''&lt;'',
        ''<'') %} {% set text = text | regex_replace(''&gt;'', ''>'') %} {% set text
        = text | regex_replace(''&quot;'', ''"'') %} {% set text = text | trim %}
        {{ text }}

        '
  mode: queued
  max: 10
  description: IMAP 이메일 트리거 데이터를 받아 인코딩을 해제하고 HTML 태그를 제거하여 일반 텍스트로 변환합니다.
unknown_3:
  sequence:
  - action: ai_task.generate_data
    data:
      task_name: weather comfort report
      instructions: "{%- set indoor_areas = ['living_room', 'bedroom', 'kitchen',
        'bathroom', 'mudroom'] -%}\n{%- set ns = namespace(temps=[], humidities=[])
        -%}\n{%- for sensor in states.sensor -%}\n  {%- if area_id(sensor.entity_id)
        in indoor_areas and sensor.state not in ['unknown', 'unavailable'] -%}\n    {%-
        if sensor.attributes.get('device_class') == 'temperature' -%}\n      {%- set
        ns.temps = ns.temps + [sensor.state | float] -%}\n    {%- elif sensor.attributes.get('device_class')
        == 'humidity' -%}\n      {%- set ns.humidities = ns.humidities + [sensor.state
        | float] -%}\n    {%- endif -%}\n  {%- endif -%}\n{%- endfor -%}\n{%- set
        weather = states.weather | selectattr('attributes.temperature', 'defined')
        | first %}\n현재의 상태:\n- 바깥 기온: {{ weather.attributes.temperature if weather
        is defined else '알 수 없음' }}°C\n- 현재 날씨: {{ state_translated(weather.entity_id)
        if weather is defined else '알 수 없음' }}\n- 실내 온도: {{ (ns.temps | average) |
        round(1) if ns.temps else '알 수 없음' }}°C\n- 실내 습도: {{ (ns.humidities | average)
        | round(1) if ns.humidities else '알 수 없음' }}%\n\n위 내용을 기반으로 간단하고 재치있게 바깥 날씨와
        실내 쾌적성에 대한 보고를 본문만 각 한 문장으로 작성해.\n"
      structure:
        weather_description:
          description: A description of the current weather outside
          required: true
          selector:
            text:
        indoor_comfort:
          description: Assessment of how comfortable it is inside compared to outside
          required: true
          selector:
            text:
    response_variable: comfort_report
  - action: persistent_notification.create
    metadata: {}
    data:
      message: "![서울](/local/seoul_weather_visualization.png)\n\n\U0001F324️ **바깥
        날씨:** {{ comfort_report.data.weather_description }}\n\n\U0001F6CB️ **실내 쾌적성:**
        {{ comfort_report.data.indoor_comfort }}"
      title: "\U0001F3E0 우리 집 환경 보고"
      notification_id: weather_home
  alias: 날씨 및 쾌적성 유머 보고서
  description: 현재 실외 날씨와 실내 쾌적도를 유머러스하게 분석하여 알림으로 생성합니다.
entity_attributes:
  alias: Entity Attributes
  icon: mdi:format-list-bulleted
  description: 'Returns the attributes of a given entity.

    You MUST know the entity_id before calling this tool.

    entity_id is MANDATORY and must always be provided.

    '
  mode: single
  fields:
    entity_id:
      name: Entity ID
      description: A single entity_id to look up attributes for (e.g. "climate.living_room").
        MANDATORY!
      required: true
      selector:
        text: {}
  sequence:
  - variables:
      eid: '{{ entity_id | string | trim | lower }}'
  - variables:
      entity_exists: '{{ states[eid] is defined }}'
  - if:
    - condition: template
      value_template: '{{ not entity_exists }}'
    then:
    - variables:
        result: "{{ {\n  'error': 'Entity not found. Use only names returned from
          \"Entity Index\" or that you looked up in the data provided to you.',\n
          \ 'code': 'entity_not_found',\n  'entity_id': eid\n} }}"
    - stop: ''
      response_variable: result
  - variables:
      result: "{%- set excluded = ['friendly_name', 'state_class', 'icon', 'unit_of_measurement',
        'entity_id'] -%}\n{%- set ns = namespace(filtered={}) -%}\n{%- for key, value
        in states[eid].attributes.items() -%}\n  {%- if key not in excluded -%}\n
        \   {%- set ns.filtered = ns.filtered | combine({key: value}) -%}\n  {%- endif
        -%}\n{%- endfor -%}\n{{ {\n  'entity_id': eid,\n  'state': states(eid),\n
        \ 'attributes': ns.filtered\n} }}"
  - stop: ''
    response_variable: result
llm_script_for_music_assistant_voice_requests:
  alias: LLM Script for Music Assistant voice requests
  use_blueprint:
    path: music-assistant/llm_voice_script.yaml
    input:
      default_player: media_player.geosil
      media_type_prompt: '이 인자는 필수이며, 어떤 경우에도 반드시 제공해야 합니다!

        "media_type"은 다음 5가지 값 중 하나만 사용할 수 있습니다:

        - "track" - 특정 곡 또는 곡 목록을 검색하는 경우.

        - "album" - 앨범 또는 앨범 목록을 검색하는 경우.

        - "artist" - 아티스트를 검색하는 경우.

        - "playlist" - 특별히 플레이리스트를 요청하는 경우.

        - "radio" - 라디오 채널을 검색하는 경우.


        media_type은 필수이며, 반드시 제공해야 합니다. 요청이 위 유형 중 어디에도 해당하지 않는 경우, 예를 들어 특정 장르의 음악을
        요청하는 경우에는 "track"을 사용하고 "media_id" 파라미터에 일치하는 곡 목록을 제공하세요.'
      artist_prompt: '"artist"는 사용자가 재생을 요청한 아티스트이거나, 사용자가 특정 곡의 재생을 요청하면서 아티스트를 언급한
        경우 해당 곡의 아티스트입니다. 아티스트를 알 수 없거나 여러 아티스트가 요청된 경우에는 빈 문자열을 사용하세요.'
      album_prompt: '"album"은 사용자가 재생을 요청한 앨범이거나, 사용자가 특정 곡의 재생을 요청하면서 언급한 경우 해당 곡이
        수록된 앨범입니다. 앨범을 알 수 없거나 여러 앨범이 요청된 경우에는 빈 문자열을 사용하세요.'
      media_id_prompt: '이 인자는 필수이며, 어떤 경우에도 반드시 제공해야 합니다!

        media_id는 track, album, artist 중 가장 구체적인 값입니다.

        "track"과 "artist"는 단일 값 또는 여러 값을 가질 수 있습니다.

        - 곡을 검색하는 경우: media_id는 곡 이름 또는 곡 이름 목록입니다 (세미콜론을 구분자로 사용). 결과에 여러 아티스트가 포함된
        경우, 아티스트 이름과 곡 이름을 대시로 구분하여 곡 이름으로 사용하세요 (예: "아티스트 이름 - 곡 이름"). 모든 곡이 동일한
        아티스트의 곡인 경우, "artist" 파라미터에 아티스트를 지정하고, 곡 이름만 media_id로 사용하세요.

        - 앨범을 검색하는 경우: media_id는 앨범 이름 또는 앨범 이름 목록입니다 (세미콜론을 구분자로 사용).

        - 아티스트를 검색하는 경우: media_id는 아티스트 이름입니다.

        - 특정 플레이리스트를 검색하는 경우: media_id는 요청된 플레이리스트에서 앞뒤의 "플레이리스트"라는 단어를 제거한 이름입니다
        (예: "좋아하는 노래 플레이리스트" 대신 "좋아하는 노래"를 반환).

        - 라디오 채널을 검색하는 경우: media_id는 요청된 채널입니다.

        이 인자는 필수이며, 반드시 제공해야 합니다.'
      media_description_prompt: '"media_description" 키는 재생할 미디어를 설명하는 데 사용됩니다. 이 값은
        음성 명령 쿼리에서 가져올 수 있지만, 미디어와 관련된 부분만 포함해야 합니다. 예를 들어 음성 요청이 "거실 스피커에서 Queen
        베스트 곡 틀어 줘"인 경우, "media_description"의 값은 "Queen 베스트 곡"이어야 합니다.'
      area_prompt: '음악 재생이 요청된 영역(area) 또는 영역들입니다. 요청에 대상(영역 또는 플레이어)이 언급되지 않은 경우,
        요청이 발생한 영역을 사용하세요.

        요청 내용이나 요청이 발생한 기기로부터 영역을 판단할 수 없는 경우, 이 파라미터를 사용하지 마세요.

        "area" 파라미터와 "media_player" 파라미터를 함께 사용하는 것은 요청에서 두 가지가 모두 명시적으로 언급된 경우에만
        해당합니다.'
      media_player_prompt: '"media_player"는 요청에서 음악을 재생할 미디어 플레이어 또는 여러 미디어 플레이어가
        명시적으로 언급된 경우에만 사용하세요. 이 값은 Music Assistant 통합에서 제공하는 미디어 플레이어의 entity_id여야
        합니다.

        "area" 파라미터와 "media_player" 파라미터를 함께 사용하는 것은 요청에서 두 가지가 모두 명시적으로 언급된 경우에만
        해당합니다.'
      shuffle_prompt: '이 인자는 필수이며, 어떤 경우에도 반드시 제공해야 합니다!

        요청에서 음악 셔플이 언급된 경우 "shuffle"을 true로 설정합니다. 그렇지 않으면 "shuffle"을 false로 설정합니다.

        예를 들어, 요청이 "Muse 음악 셔플해 줘"인 경우, "shuffle"은 true로 설정해야 합니다.

        요청이 "Billy Talent 음악 틀어 줘"인 경우, 셔플을 언급하거나 요청하지 않았으므로 "shuffle"은 false입니다.

        요청이 "좋아하는 노래 플레이리스트 셔플해 줘"인 경우, "shuffle"은 true로 설정해야 합니다.

        요청이 "Guns and Roses 아티스트 틀어 줘"인 경우, 셔플을 언급하거나 요청하지 않았으므로 "shuffle"은 false로
        설정해야 합니다.'
  description: ''
unknown_4:
  sequence:
  - variables:
      weather_entity: weather.gisangceong_nalssiyebo_seoulteugbyeolsi_seocogu
      calendar_duration:
        hours: 17
      prompt: "알림으로 안내될 한국어 음성 메시지를 생성해 주세요. 이 메시지는 사용자가 잠에서 깰 때 들려주며, 유용한 정보를 포함해야
        합니다.\n당신은 사용자를 위해 텍스트를 생성하는 친절한 개인 비서입니다:\n1. 응답은 도움이 되고, 친근하며, 따뜻하고, 통찰력
        있어야 합니다. 2. 응답은 기술적이지 않아야 하며, Home Assistant 내부 요소(예: 엔티티 등)는 포함하지 않습니다. 3.
        메시지는 사용자가 하루를 준비하는 데 도움이 되어야 합니다. 예를 들어:\n  - 해당 시기와 지역에 비해 특이한 날씨가 있다면 알려주기
        (예: 단순히 “강수 확률 0%” 같은 평범한 정보는 제외)\n  - 첫 일정까지 남은 시간 안내\n  - 생일 등 특별하거나 기념할
        만한 일이 있다면 언급\n4. 음성 메시지의 끝에서는 사용자에게 도와줄 일이 있는지 물어보세요."
  - variables:
      calendar_entities: "{{ states.calendar\n   | rejectattr('state', 'in', ['unavailable',
        'unknown'])\n   | map(attribute='entity_id')\n   | list }}"
  - alias: Fetch All Calendar Agendas
    repeat:
      for_each: '{{ calendar_entities }}'
      sequence:
      - alias: Fetch Calendar Agenda
        data:
          duration:
            hours: 18
        target:
          entity_id: '{{ repeat.item }}'
        response_variable: agenda_result
        action: calendar.get_events
      - variables:
          agendas: "{{ (agendas | default([])) + [{\n  'entity_id': repeat.item,\n
            \ 'name': state_attr(repeat.item, 'friendly_name'),\n  'events': (agenda_result
            | items | first)[1].events\n}] }}"
  - alias: Fetch Weather Forecast
    if:
    - condition: template
      value_template: '{{ has_value(weather_entity) }}'
    then:
    - data:
        type: hourly
      target:
        entity_id:
        - '{{ weather_entity }}'
      response_variable: daily_forecast
      action: weather.get_forecasts
    - variables:
        forecast_entity: '{{ daily_forecast[weather_entity] }}'
        forecast: '{{ forecast_entity.forecast[0] }}'
  - action: ai_task.generate_data
    metadata: {}
    data:
      instructions: "현재 시간: {{ now().strftime(\"%A %B %d %H:%M %p\") }}\n\n\n{%- if
        forecast is defined %}\n{%- set temperature_unit = state_attr(weather_entity,
        'temperature_unit') -%}\n기상예보: {{ forecast.condition }} ({{ forecast.temperature
        }}{{ temperature_unit }} {%- if forecast.precipitation_probability is defined
        -%} , 강수확률 {{ forecast.precipitation_probability }}% {%- endif -%})\n{%- endif
        %}\n\n{%- for cal in agendas %}\n캘린더 \"{{ cal.name }}\" 일정이 다음 {{ calendar_duration.hours
        }} 시간 내에 있음:\n  {%- if cal.events %}\n    {%- for event in cal.events %}\n
        \   - 요약: {{ event.summary }}\n      시간: {% if event.start is defined %}{{
        event.start }} 부터 {{ event.end }} 까지{% else %}하루 종일{% endif %}\n      {%-
        if event.description is defined %}\n      설명: {{ event.description }}\n      {%
        endif -%}\n      {%- if event.location is defined %}\n        장소: {{ event.location
        }}\n      {% endif -%}\n    {%- endfor %}\n  {%- else %}\n    - 일정 없음.\n  {%-
        endif %}\n{%- endfor %}\n\n{{ prompt }}"
      task_name: Morning Agenda
    response_variable: response
  - alias: Return Generated Message
    variables:
      briefing:
        message: '{{ response.data }}'
        title: '{{ states(''sensor.date'') }} 아침 브리핑'
  - stop: 아침 브리핑 메시지 생성 완료
    response_variable: briefing
  alias: 아젠다 브리핑
  description: 날씨와 모든 캘린더 정보를 기반으로 AI 아침 브리핑 메시지를 생성하여 response variable로 반환합니다.
