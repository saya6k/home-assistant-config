        }}"
    action: persistent_notification.create
  alias: 업데이트 변경 기록 요약 알림
  description: 선택된 엔티티의 업데이트 정보를 AI로 분석하여 전체 요약, 주요 기능, 버그 수정, 주의사항을 포함하는 영구 알림을 생성합니다.
message_broadcast:
  alias: 메시지 방송 (Message Broadcast)
  description: '점유된 Area의 Satellite에 방송하고, 점유된 Area가 없으면 지정한 Target에 방송합니다. Target이
    지정되지 않으면 모든 Satellite에 방송합니다.

    '
  fields:
    message:
      name: 메시지
      description: 방송할 메시지
      required: true
      selector:
        text:
          multiline: true
    default_target:
      name: Default Target
      description: '점유된 Area가 없을 때 사용할 대상 (Area, Device, Entity 모두 가능)

        '
      required: false
      selector:
        target:
          entity:
            domain: assist_satellite
  sequence:
  - variables:
      occupied_satellites: "{% set ns = namespace(items=[]) %}\n{% for area in areas()
        %}\n\n  {% set found = namespace(satellites=[], occupied=false) %}\n\n  {%
        for entity in area_entities(area) %}\n\n    {% if entity.startswith('assist_satellite.')\n
        \         and states(entity) not in ['unavailable', 'unknown'] %}\n      {%
        set found.satellites = found.satellites + [entity] %}\n    {% endif %}\n\n
        \   {% if state_attr(entity, 'device_class') == 'occupancy'\n          and
        is_state(entity, 'on') %}\n      {% set found.occupied = true %}\n    {% endif
        %}\n\n  {% endfor %}\n\n  {% if found.satellites | count > 0 and found.occupied
        %}\n    {% set ns.items = ns.items + found.satellites %}\n  {% endif %}\n\n{%
        endfor %}\n{{ ns.items }}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ occupied_satellites | count > 0 }}'
      sequence:
      - action: assist_satellite.announce
        target:
          entity_id: '{{ occupied_satellites }}'
        data:
          message: '{{ message }}'
    default:
    - if:
      - condition: template
        value_template: "{{ default_target is defined\n   and default_target not in
          (none, '', {}) }}\n"
      then:
      - action: assist_satellite.announce
        target: '{{ default_target }}'
        data:
          message: '{{ message }}'
      else:
      - action: assist_satellite.announce
        target:
          entity_id: "{{ states.assist_satellite\n   | rejectattr('state', 'in', ['unavailable',
            'unknown'])\n   | map(attribute='entity_id')\n   | list }}\n"
        data:
          message: '{{ message }}'
  mode: queued
  max: 5
unknown_11:
  mode: queued
  max: 10
  fields:
    entity:
      name: 기기
      description: '제어할 climate 엔티티입니다. 반드시 실제 존재하는 climate.* 엔티티를 지정하세요.

        '
      required: true
      selector:
        entity:
          filter:
            domain: climate
    hvac_mode:
      name: 운전 모드
      description: 'HVAC 운전 모드입니다. 예: off, heat, cool, dry, fan_only, auto, heat_cool.
        반드시 대상 엔티티의 hvac_modes에 있는 값만 사용하세요.

        '
      required: false
      selector:
        text:
    temperature:
      name: 목표 온도
      description: '목표 온도입니다. 대상 climate 엔티티의 min_temp와 max_temp 범위 안이어야 합니다.

        '
      required: false
      selector:
        number:
          min: 5
          max: 40
          step: 0.5
          unit_of_measurement: °C
    fan_mode:
      name: 팬 세기
      description: '에어컨 팬 세기입니다. 반드시 대상 엔티티의 fan_modes에 있는 실제 값을 사용하세요. LG 에어컨에서는
        모델에 따라 Very Low, Low, Medium, High, Power 등의 값이 있을 수 있습니다. 사용자가 "매우 낮게", "아주
        약하게", "최저"라고 하면 fan_modes에 대응하는 Very Low 계열 값을 선택하세요. 사용자가 "파워", "강력", "터보",
        "최대로"라고 하면 fan_modes에 대응하는 Power 계열 값을 선택하세요.

        '
      required: false
      selector:
        text:
    swing_mode:
      name: 수직 회전
      description: '상하/수직 바람 방향 또는 회전 모드입니다. 반드시 대상 엔티티의 swing_modes에 존재하는 실제 값을 사용하세요.

        '
      required: false
      selector:
        text:
    swing_horizontal_mode:
      name: 수평 회전
      description: '좌우/수평 바람 방향 또는 회전 모드입니다. 반드시 대상 엔티티의 swing_horizontal_modes에 존재하는
        실제 값을 사용하세요.

        '
      required: false
      selector:
        text:
  sequence:
  - variables:
      target_entity: '{{ entity | default('''') }}'
      requested_hvac: '{{ hvac_mode | default('''') | string }}

        '
      requested_fan: '{{ fan_mode | default('''') | string }}

        '
      requested_swing: '{{ swing_mode | default('''') | string }}

        '
      requested_horizontal_swing: '{{ swing_horizontal_mode | default('''') | string
        }}

        '
      has_temperature: '{{ temperature is defined and temperature is not none }}

        '
  - if:
    - condition: template
      value_template: "{{ target_entity == ''\n   or not target_entity.startswith('climate.')
        }}\n"
    then:
    - stop: '잘못된 climate 엔티티입니다: {{ target_entity }}

        '
      error: true
  - if:
    - condition: template
      value_template: "{{ states(target_entity) in ['unknown', 'unavailable']\n   and
        state_attr(target_entity, 'friendly_name') is none }}\n"
    then:
    - stop: '존재하지 않거나 사용할 수 없는 climate 엔티티입니다: {{ target_entity }}

        '
      error: true
  - variables:
      available_hvac_modes: '{{ state_attr(target_entity, ''hvac_modes'') | default([],
        true) }}

        '
      available_fan_modes: '{{ state_attr(target_entity, ''fan_modes'') | default([],
        true) }}

        '
      available_swing_modes: '{{ state_attr(target_entity, ''swing_modes'') | default([],
        true) }}

        '
      available_horizontal_swing_modes: "{{ state_attr(\n     target_entity,\n     'swing_horizontal_modes'\n
        \  ) | default([], true) }}\n"
      device_min_temp: '{{ state_attr(target_entity, ''min_temp'') }}

        '
      device_max_temp: '{{ state_attr(target_entity, ''max_temp'') }}

        '
  - if:
    - condition: template
      value_template: '{{ states(target_entity) == ''unavailable'' }}

        '
    then:
    - stop: '{{ target_entity }} 기기가 현재 unavailable 상태입니다.

        '
      error: true
  - if:
    - condition: template
      value_template: "{{\n  requested_hvac != ''\n  and requested_hvac not in available_hvac_modes\n}}\n"
    then:
    - stop: '지원하지 않는 HVAC 모드입니다. 요청: {{ requested_hvac }} 지원 모드: {{ available_hvac_modes
        | join('', '') }}

        '
      error: true
  - if:
    - condition: template
      value_template: "{{\n  requested_fan != ''\n  and requested_fan not in available_fan_modes\n}}\n"
    then:
    - stop: '지원하지 않는 팬 모드입니다. 요청: {{ requested_fan }} 지원 팬 모드: {{ available_fan_modes
        | join('', '') }}

        '
      error: true
  - if:
    - condition: template
      value_template: "{{\n  requested_swing != ''\n  and requested_swing not in available_swing_modes\n}}\n"
    then:
    - stop: '지원하지 않는 수직 회전 모드입니다. 요청: {{ requested_swing }} 지원 모드: {{ available_swing_modes
        | join('', '') }}

        '
      error: true
  - if:
    - condition: template
      value_template: "{{\n  requested_horizontal_swing != ''\n  and requested_horizontal_swing\n
        \       not in available_horizontal_swing_modes\n}}\n"
    then:
    - stop: '지원하지 않는 수평 회전 모드입니다. 요청: {{ requested_horizontal_swing }} 지원 모드: {{ available_horizontal_swing_modes
        | join('', '') }}

        '
      error: true
  - if:
    - condition: template
      value_template: "{{\n  has_temperature\n  and not is_number(temperature)\n}}\n"
    then:
    - stop: '목표 온도가 숫자가 아닙니다: {{ temperature }}

        '
      error: true
  - if:
    - condition: template
      value_template: "{{\n  has_temperature\n  and device_min_temp is not none\n
        \ and (temperature | float)\n        < (device_min_temp | float)\n}}\n"
    then:
    - stop: '목표 온도 {{ temperature }}°C는 {{ target_entity }}의 최소 설정 온도 {{ device_min_temp
        }}°C보다 낮습니다.

        '
      error: true
  - if:
    - condition: template
      value_template: "{{\n  has_temperature\n  and device_max_temp is not none\n
        \ and (temperature | float)\n        > (device_max_temp | float)\n}}\n"
    then:
    - stop: '목표 온도 {{ temperature }}°C는 {{ target_entity }}의 최대 설정 온도 {{ device_max_temp
        }}°C보다 높습니다.

        '
      error: true
  - if:
    - condition: template
      value_template: '{{ requested_hvac != '''' }}

        '
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: '{{ target_entity }}'
      data:
        hvac_mode: '{{ requested_hvac }}'
  - if:
    - condition: template
      value_template: '{{ has_temperature }}

        '
    then:
    - action: climate.set_temperature
      target:
        entity_id: '{{ target_entity }}'
      data:
        temperature: '{{ temperature | float }}'
  - if:
    - condition: template
      value_template: '{{ requested_fan != '''' }}

        '
    then:
    - action: climate.set_fan_mode
      target:
        entity_id: '{{ target_entity }}'
      data:
        fan_mode: '{{ requested_fan }}'
  - if:
    - condition: template
      value_template: '{{ requested_swing != '''' }}

        '
    then:
    - action: climate.set_swing_mode
      target:
        entity_id: '{{ target_entity }}'
      data:
        swing_mode: '{{ requested_swing }}'
  - if:
    - condition: template
      value_template: '{{ requested_horizontal_swing != '''' }}

        '
    then:
    - action: climate.set_swing_horizontal_mode
      target:
        entity_id: '{{ target_entity }}'
      data:
        swing_horizontal_mode: '{{ requested_horizontal_swing }}

          '
  alias: 냉난방 통합제어
  description: '에어컨, 보일러 등 climate 엔티티를 통합 제어합니다.

    목표 온도, HVAC 운전 모드, 팬 세기, 수직 회전, 수평 회전을 설정할 수 있습니다.

    전달된 값은 해당 climate 엔티티가 실제로 지원하는지 먼저 검사합니다.

    지원하지 않는 값을 임의로 추측해서 사용하지 마세요.'
