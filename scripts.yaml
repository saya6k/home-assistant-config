unknown_7:
  sequence:
  - variables:
      camera_snake_case: '{{ camera | lower | replace('' '', ''_'') }}'
      primary_objects:
      - person
      - car
      secondary_objects:
      - bear
      - dog
      - cat
      - raccoon
      - squirrel
      - bicycle
      - rabbit
      sensor_info_text: "# AI NVR 정보\n\n# 주요 객체\n\n{% for obj in primary_objects %}\n
        \ {% set sensor_id = 'sensor.' ~ camera_snake_case ~ '_' ~ obj ~ '_count'
        %}\n  {% set sensor_state = states(sensor_id) %}\n  {% if sensor_state is
        not none and sensor_state != 'unknown' and sensor_state != 'unavailable' %}\n
        \ {% set active_sensor_id = 'sensor.' ~ camera_snake_case ~ '_' ~ obj ~ '_active_count'
        %}\n  {% set active_state = states(active_sensor_id) | default(0) %}\n  -
        {{ obj }} 수: {{ sensor_state }} (이 중 활성 객체: {{ active_state }})\n  {% endif
        %}\n{% endfor %}\n\n{% set last_face = states('sensor.' ~ camera_snake_case
        ~ '_last_recognized_face') | default('') %}\n{% if last_face and last_face
        != 'unknown' and last_face != 'None' and last_face != '' %}\n- 인식된 사람 이름:
        {{ last_face }}\n{% endif %}\n\n# 보조 객체\n\n{% for obj in secondary_objects
        %}\n  {% set sensor_id = 'sensor.' ~ camera_snake_case ~ '_' ~ obj ~ '_count'
        %}\n  {% set sensor_state = states(sensor_id) %}\n  {% if sensor_state is
        not none and sensor_state != 'unknown' and sensor_state != 'unavailable' %}\n
        \ {% set active_sensor_id = 'sensor.' ~ camera_snake_case ~ '_' ~ obj ~ '_active_count'
        %}\n  {% set active_state = states(active_sensor_id) | default(0) %}\n  -
        {{ obj }} 수: {{ sensor_state }} (이 중 활성 객체: {{ active_state }})\n  {% endif
        %}\n{% endfor %}\n"
      instructions_text: '{{ sensor_info_text }}

        # 분석 제공 방법

        ## 일반 지침

        위의 AI NVR 센서 데이터는 실제 카메라 화면에 존재하는 객체를 나타내는 신뢰 가능한 정보입니다. 객체 존재 여부 판단은 반드시
        이 센서 값을 기준으로 하세요.

        ## 보고해야 할 내용

        활성 개수(active count)가 0보다 큰 객체 유형만 보고하세요. 총 개수(total count)가 0보다 크더라도 활성 개수가
        0이면 절대 설명하지 마세요.

        즉, 실제로 움직이거나 현재 존재하는 객체만 설명하세요.

        ## 응답 형식

        활성 객체가 있는 각 유형에 대해 간결하게 다음을 포함하세요: - 어떤 객체인지 - 화면 내 위치 (예: 전경, 배경, 왼쪽, 중앙
        등) - 수행 중인 동작 또는 움직임 - 중요한 경우에만 식별 가능한 추가 정보

        각 객체 설명은 1~3문장 이내로 유지하세요. 간결하고 사실적으로 작성하세요.

        ## 제외해야 할 내용

        - 활성 개수가 0인 객체 - 움직이지 않는 정지 객체 또는 주차된 차량 - 화면의 모든 객체를 나열하는 상세 설명 - 배경이나 환경
        요소 설명 - 헤더, 마크다운, 리스트 형식 사용 금지

        ## 활성 객체가 없는 경우

        모든 객체의 활성 개수가 0이면, "현재 화면에 활성 객체가 없습니다"라고만 간단히 답하세요.

        '
  - action: ai_task.generate_data
    metadata: {}
    data:
      task_name: 카메라 프레임 분석
      instructions: '{{ instructions_text | trim }}'
      attachments:
