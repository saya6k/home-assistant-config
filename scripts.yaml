        media_content_type: image/jpeg
        metadata:
          title: '{{ state_attr(camera_snake_case, ''friendly_name'') }}'
          thumbnail: /api/camera_proxy/{{ camera_snake_case }}
          media_class: video
          navigateIds:
          - {}
          - media_content_type: app
            media_content_id: media-source://camera
    response_variable: analysis
  - variables:
      response:
        instructions: '# 카메라 응답 생성 가이드

          비전 모델의 분석 결과를 바탕으로 사용자의 질문에 자연스럽고 간결하게 답하세요.

          ## 응답 방식

          - 사람이 말하듯 자연스럽게 요약 - 사용자의 질문에 직접적으로 답변 - 1~3문장 이내로 간결하게 - 활성 객체만 언급 - 활성
          객체가 없으면 명확히 없음이라고 말할 것 - 센서 수치나 기술적 내용은 필요할 때만 언급 - 분석 문장을 그대로 반복하지 말 것

          ## 예시

          분석 결과: "전경에 한 사람이 보이며 현관 앞에서 기다리고 있음"

          좋은 답변: "현관 앞에 한 사람이 기다리고 있어요."

          나쁜 답변: "카메라 분석에 따르면 전경에 한 사람이 보이며 현관 앞에서 기다리고 있습니다."

          '
        output: '{{ analysis.data }}'
