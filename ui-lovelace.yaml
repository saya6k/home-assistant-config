  en-en:
    variables:
      lang_on: 'On'
      lang_off: 'Off'
      lang_not_home: Away
      lang_home: Home
      lang_paused: paused
      lang_playing: playing
      lang_stopped: stopped
      lang_heat: heat
      lang_armed_night: Night
      lang_armed_custom_bypass: Silent Alarm
      lang_arming: Arming
      lang_armed_away: Away
      lang_disarmed: Disarmed
      date_format: de-DE
      time_unit: ' Uhr'
  state_engine:
    template:
      - en-en
    variables:
      round: -1
      multiplier: 1
      show_last_changed: false
      force_date: false
      show_unit: false
      has_time: '[[[ return states[entity.entity_id].attributes.has_time != null &&
        states[entity.entity_id].attributes.has_time; ]]]'
      has_date: '[[[ return states[entity.entity_id].attributes.has_date != null &&
        states[entity.entity_id].attributes.has_date; ]]]'
    custom_fields:
      cs: "[[[\n  let state = states[entity.entity_id].state;\n\n  if(!isNaN(state))\
        \ {\n    state = state * variables.multiplier;\n\n    let unit = variables.show_unit\
        \ ? states[entity.entity_id].attributes.unit_of_measurement : '';\n\n    if(variables.round\
        \ >= 0) {\n      let exp = Math.pow(10,variables.round);\n      state = Math.round(state\
        \ * exp) / exp;\n    }\n\n    return state + ' ' + unit;\n  } \n  \n  if ((variables.has_time\
        \ || variables.has_date) || variables.show_last_changed || variables.show_last_triggered\
        \ || variables.force_date) {\n\n    let has_date = variables.has_date;\n \
        \   let has_time = variables.has_time;\n\n    let d = '';\n\n    if (variables.show_last_changed)\
        \ {\n      d = new Date(states[entity.entity_id].last_changed);\n    } else\
        \ if (variables.show_last_triggered) {\n      d = new Date(states[entity.entity_id].attributes.last_triggered);\n\
        \    } else {\n      d = new Date(state);\n    }\n\n    d = variables.force_date\
        \ ? new Date(d) : d;\n\n    if (!has_date && has_time) {\n      return d.toLocaleTimeString([],\
        \ {hour: '2-digit', minute:'2-digit'}) + 'Uhr';\n    } else if (!has_time\
        \ && has_date) {\n      return d.toLocaleString(variables.date_format,{day:'numeric',\
        \ month:'short', year:'numeric'});\n    } else {\n      let d_date = d.toLocaleString(variables.date_format,{day:'numeric',\
        \ month:'short', year:'numeric'});\n      let today = (new Date()).toLocaleString(variables.date_format,{day:'numeric',\
        \ month:'short', year:'numeric'});\n      \n      if(d_date == today) {\n\
        \        let time = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});\n\
        \        return time + variables.time_unit;\n      }\n\n      return d_date;\n\
        \    }\n  }\n\n  var lang = {\n    \"on\": variables.lang_on,\n    \"off\"\
        : variables.lang_off,\n    \"not_home\": variables.lang_not_home,\n    \"\
        home\": variables.lang_home,\n    \"paused\": variables.lang_paused,\n   \
        \ \"playing\": variables.lang_playing,\n    \"stopped\": variables.lang_stopped,\n\
        \    \"heat\": variables.lang_heat,\n    \"night\": variables.lang_armed_night,\n\
        \    \"armed_custom_bypass\": variables.lang_armed_custom_bypass,\n    \"\
        arming\": variables.lang_arming,\n    \"armed_away\": variables.lang_armed_away,\n\
        \    \"disarmed\": variables.lang_disarmed\n  };\n\n  let trans_state = lang[state];\n\
        \n  return trans_state != null ? trans_state : state; \n]]]\n"
      es: "[[[\n  if ((variables.has_time || variables.has_date) || variables.show_last_changed\
        \ || variables.show_last_triggered || variables.force_date) {\n    let state\
        \ = states[entity.entity_id].state;\n\n    let has_time = variables.has_time;\n\
        \    let has_date = variables.has_date;\n\n    let d = '';\n\n    if (variables.show_last_changed)\
        \ {\n      d = new Date(states[entity.entity_id].last_changed);\n    } else\
        \ if (variables.show_last_triggered) {\n      d = new Date(states[entity.entity_id].attributes.last_triggered);\n\
        \    } else {\n      d = new Date(state);\n    }\n\n    d = variables.force_date\
        \ ? new Date(d) : d;\n\n    let d_date = d.toLocaleString('de-de',{day:'numeric',\
        \ month:'short', year:'numeric'});\n    let today = (new Date()).toLocaleString('de-de',{day:'numeric',\
        \ month:'short', year:'numeric'});\n      \n    if(d_date != today) {\n  \
        \    let time = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});\n\
        \      return time + variables.time_unit;\n    }\n  }\n]]]\n"
