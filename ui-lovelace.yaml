kiosk_mode:
  non_admin_settings:
    hide_header: true
    ignore_entity_settings: true
decluttering_templates:
  footer_template:
    default:
      - color-1: var(--contrast20)
      - color-2: var(--contrast20)
      - color-3: var(--contrast20)
      - color-4: var(--contrast20)
      - color-5: var(--contrast20)
      - bgcolor-1: var(--contrast4)
      - bgcolor-2: var(--contrast4)
      - bgcolor-3: var(--contrast4)
      - bgcolor-4: var(--contrast4)
      - bgcolor-5: var(--contrast4)
    card:
      type: vertical-stack
      cards:
        - type: conditional
          conditions:
            - condition: and
              conditions:
                - condition: screen
                  media_query: '(min-width: 0px) and (max-width: 767px)'
                - condition: or
                  conditions:
                    - condition: state
                      entity: media_player.living_room
                      state: playing
                    - condition: state
                      entity: media_player.living_room
                      state: paused
          card:
            type: custom:button-card
            template: custom_card_mediaplayer_bottom
            entity: media_player.living_room
navbar-templates:
  my_navbar:
    layout:
      auto_padding:
        enabled: true
        desktop_px: 100
        mobile_px: 180
    desktop:
      position: left
      min_width: 768
      show_labels: true
    mobile:
      show_labels: true
    routes:
      - icon: mdi:home-outline
        icon_selected: mdi:home-assistant
        url: home
        label: Home
      - icon: mdi:sofa-outline
        icon_selected: mdi:sofa
        label: Rooms
        selected: "[[[\n  if (location.hash == '#living-room') return true;\n  else\
          \ if (location.hash == '#bedroom') return true;\n  else if (location.hash\
          \ == '#kitchen') return true;\n  else if (location.hash == '#bathroom')\
          \ return true;\n  else if (location.hash == '#mudroom') return true;\n \
          \ else return false;\n]]]"
        badge:
          show: '[[[ return states[''light.all_lights''].state === ''on'' ]]]'
          color: var(--yellow-color)
          count: '[[[ return states[''sensor.count_lights_on''].state ]]]'
        tap_action:
          action: open-popup
        popup:
          - icon: mdi:sofa-outline
            url: home#living-room
            label: 거실
          - icon: mdi:bed-king-outline
            url: home#bedroom
            label: 침실
          - icon: mdi:silverware-variant
            url: home#kitchen
            label: 주방
          - icon: mdi:paper-roll-outline
            url: home#bathroom
            label: 화장실
          - icon: mdi:coat-rack
            url: home#mudroom
            label: 현관
      - icon: mdi:music
        url: music
        label: Music
        badge:
          show: "[[[\n  if (states['media_player.living_room'].state == \"playing\"\
            ) return true;\n  else if (states['media_player.bathroom'].state == \"\
            playing\") return true;\n  else return false;\n]]]"
          color: var(--green-color)
        selected: "[[[\n  return location.hash == 'music';\n]]]"
        hidden: "[[[\n  if (states['media_player.living_room'].state == \"playing\"\
          ) return false;\n  else if (states['media_player.bathroom'].state == \"\
          playing\") return false;\n  else if (states['remote.living_room_apple_tv'].state\
          \ == \"on\") return true;\n  else return false;\n]]]"
        hold_action:
          action: open-popup
        popup:
          - icon: mdi:music
            url: music
            label: Music
          - icon: mdi:television
            url: home#remote
            label: TV
      - icon: mdi:television
        url: home#remote
        label: TV
        badge:
          show: '[[[ return states[''media_player.living_room_apple_tv''].state ===
            ''playing'' ]]]'
          color: var(--green-color)
        hidden: "[[[\n  if (states['media_player.living_room'].state == \"playing\"\
          ) return true;\n  elif (states['media_player.bathroom'].state == \"playing\"\
          ) return true;\n  else if (states['remote.living_room_apple_tv'].state ==\
          \ \"on\") return false;\n  else return true;\n]]]"
        selected: "[[[\n  return location.hash == '#remote';\n]]]"
        hold_action:
          action: open-popup
        popup:
          - icon: mdi:music
            url: music
            label: Music
          - icon: mdi:television
            url: home#remote
            label: TV
      - url: energy
        label: Energy
        icon: mdi:lightning-bolt
        hidden: '[[[ return navbar.isDesktop == false ]]]'
      - icon: mdi:shield-outline
        icon_selected: mdi:security
        url: security
        label: Security
        badge:
          show: "[[[\n  if (states['sensor.count_windows_open'].state > 0 ) return\
            \ true;\n  else if (states['sensor.count_doors_open'].state > 0 ) return\
            \ true;\n  else return false;\n]]]"
          color: var(--red-color)
          count: "[[[\n  return Number(states['sensor.count_windows_open'].state)\
            \ + Number(states['sensor.count_doors_open'].state)\n]]]"
      - image: "[[[ \n  return hass.states[\"person.saya6k\"].attributes.entity_picture\n\
          ]]]"
        url: home#saya6k
        label: 원규
        selected: "[[[\n  return location.hash == '#saya6k';\n]]]"
        hidden: '[[[ return user.name != "원규" ]]]'
        badge:
          show: '[[[ return states[''person.saya6k''].state === ''home'' ]]]'
          color: var(--green-color)
      - image: "[[[ \n  return hass.states[\"person.eunbi\"].attributes.entity_picture\n\
          ]]]"
        url: home#eunbi
        label: 서현
        selected: "[[[\n  return location.hash == '#eunbi';\n]]]"
        hidden: '[[[ return user.name != "서현" ]]]'
        badge:
          show: '[[[ return states[''person.eunbi''].state === ''home'' ]]]'
          color: var(--green-color)
      - icon: mdi:dots-horizontal
        label: More
        badge:
          show: "[[[\n  if (states['sensor.count_battery_low'].state > 0) return true;\n\
            \  else if (states['binary_sensor.grocy_expired_products'].state === \"\
            on\") return true;\n  else if (states['binary_sensor.grocy_expiring_products'].state\
            \ === \"on\") return true;\n  else if (states['binary_sensor.grocy_overdue_products'].state\
            \ === \"on\") return true;\n  else if (states['binary_sensor.grocy_missing_products'].state\
            \ === \"on\") return true;\n  else if (states['binary_sensor.system_check_home_assistant'].state\
            \ === \"on\" && user.name !== \"원규\") return true;\n  else if (states['binary_sensor.system_check_truenas'].state\
            \ === \"on\" && user.name !== \"원규\") return true;\n  else if (states['binary_sensor.system_check_unifi'].state\
            \ === \"on\" && user.name !== \"원규\") return true;\n  else if (states['binary_sensor.any_update_available'].state\
            \ === \"on\" && user.name !== \"원규\") return true;\n  else return false;\n\
            ]]]"
          color: var(--red-color)
        tap_action:
          action: open-popup
        popup:
          - icon: mdi:server-outline
            url: server
            label: Server
            hidden: '[[[ return user.name != "원규" ]]]'
            badge:
              show: "[[[\n  if (states['binary_sensor.system_check_home_assistant'].state\
                \ == \"on\") return true;\n  else if (states['binary_sensor.system_check_truenas'].state\
                \ == \"on\") return true;\n  else if (states['binary_sensor.system_check_unifi'].state\
                \ == \"on\") return true;\n  else return false;\n]]]"
              color: var(--red-color)
          - icon: mdi:battery-20
            url: server#battery
            label: Battery
            badge:
              show: "[[[\n  if (states['sensor.count_battery_low'].state > 0 ) return\
                \ true;\n  else return false;\n]]]"
              color: var(--red-color)
          - icon: mdi:cellphone-arrow-down
            url: server#update
            label: Update
            hidden: '[[[ return user.name != "원규" ]]]'
            badge:
              show: "[[[\n  if (states['binary_sensor.any_update_available'].state\
                \ == \"on\") return true;\n  else return false;\n]]]"
              color: var(--red-color)
              count: "[[[\n  return states['sensor.count_updates_available'].state\n\
                ]]]"
          - url: energy
            label: Energy
            icon: mdi:lightning-bolt
            hidden: "[[[\n  return navbar.isDesktop\n]]]"
          - icon: mdi:cart
            url: grocy
            label: Grocy
            badge:
              show: "[[[ \n  if (states['todo.grocy_shopping_list'].state > 0) return\
                \ true;\n  else if (states['binary_sensor.grocy_expired_products'].state\
                \ == \"on\") return true;\n  else if (states['binary_sensor.grocy_expiring_products'].state\
                \ == \"on\") return true;\n  else if (states['binary_sensor.grocy_overdue_products'].state\
                \ == \"on\") return true;\n  else if (states['binary_sensor.grocy_missing_products'].state\
                \ == \"on\") return true;\n  else return false;\n]]]"
              color: var(--red-color)
              count: "[[[\n  return states['todo.grocy_shopping_list'].state\n]]]"
          - icon: mdi:bookshelf
            url: music
            label: Music Assistant
          - icon: mdi:cog
            url: /config/dashboard
            label: Settings
            badge:
              show: "[[[\n  if (states['update.home_assistant_core_update'].state\
                \ == \"on\") return true;\n  else if (states['update.home_assistant_supervisor_update'].state\
                \ == \"on\") return true;\n  else if (states['update.home_assistant_operating_system_update'].state\
                \ == \"on\") return true;\n  else return false;\n]]]"
              color: var(--red-color)
            hidden: '[[[ return user.name != "원규"]]]'
          - icon: mdi:hammer
            url: /developer-tools/yaml
            label: Developer Tools
            hidden: '[[[ return user.name != "원규" ]]]'
    styles: ".navbar {\n  --navbar-primary-color: var(--purple-color);\n  background:\
      \ var(--contrast2);\n}\n.image {\n  border-radius: 16px !important;\n}"
button_card_templates:
  custom_person_card:
    template: setup
    show_entity_picture: true
    show_name: false
    tap_action:
      action: more-info
    styles:
      grid:
        - grid-template-areas: '"info"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content
      card:
        - background: none
        - padding: 0
        - position: relative
        - --mdc-ripple-press-opacity: 0
      img_cell:
        - position: absolute
      icon:
        - width: 150%
        - opacity: "[[[\n  if (entity.state == \"not_home\") return \"var(--color-tint)\"\
            ;\n  else return \"100\";\n]]]\n"
        - -webkit-filter: blur(20px)
        - -moz-filter: blur(20px)
        - -o-filter: blur(20px)
        - -ms-filter: blur(20px)
        - filter: blur(20px)
    custom_fields:
      info:
        card:
          type: custom:button-card
          entity: '[[[ return entity.entity_id ]]]'
          show_entity_picture: true
          show_label: false
          show_state: true
          tap_action:
            action: more-info
            haptic: success
          styles:
            grid:
              - grid-template-areas: '"i" "s" "n"'
              - grid-template-columns: 1fr
              - grid-template-rows: 1fr
            icon:
              - width: 74px
              - color: var(--contrast20)
            img_cell:
              - justify-content: flex-end
            name:
              - justify-self: start
              - font-size: 11px
              - margin-bottom: 2px
              - color: var(--white)
              - opacity: 0.7
            card:
              - background: none
              - height: 166px
              - box-shadow: none
              - border-radius: 24px
              - padding: 0px 0px 16px 14px
              - z-index: 1
            entity_picture:
              - border-radius: 100%
              - margin-right: 10px
            state:
              - justify-self: start
              - font-size: 20px
              - margin-top: 21px
              - font-weight: 500
              - color: '[[[ return variables.color_off ]]]'
  custom_card_user:
    template: setup
    show_entity_picture: false
    show_icon: false
    show_label: true
    entity: "[[[\n  if (user.name == \"원규\") return \"person.saya6k\";\n  else return\
      \ \"person.\" + user.name.toLowerCase();\n]]]\n"
    name: '[[[return "안녕하세요, " + user.name +"!"]]]'
    label: "[[[\n  if (entity.state == \"home\") {\n    return \"돌아오셔서 기뻐요.\";\n \
      \ } else {\n    return \"오실때까지 기다릴게요.\";\n  }\n]]]\n"
    tap_action:
      action: navigate
      navigation_path: settings
    state:
      - value: not_home
        styles:
          entity_picture:
            - filter: grayscale(100%)
    styles:
      card:
        - padding: 12px 0px 12px 12px
        - background: none
        - box-shadow: none
      grid:
        - grid-template-areas: '"pic n one two three four" "pic l one two three four"'
        - grid-template-rows: min-content min-content min-content
        - grid-template-columns: 50px 1fr 50px 50px 50px 50px
      name:
        - justify-self: start
        - align-self: center
        - font-weight: 700
        - font-size: 15px
        - padding-left: 15px
      label:
        - justify-self: start
        - align-self: start
        - font-size: 12px
        - font-weight: 500
        - color: var(--contrast14)
        - padding-left: 15px
      entity_picture:
        - width: 40px
        - height: 40px
        - border-radius: 12px
      custom_fields:
        badge:
          - position: absolute
          - left: 47px
          - top: 9px
    custom_fields:
      badge:
        card:
          type: custom:button-card
          entity: '[[[ return entity.entity_id ]]]'
          show_icon: true
          show_name: false
          icon: mdi:account-tie-voice
          state:
            - value: not_home
              styles:
                card:
                  - background: var(--red)
          styles:
            card:
              - border-radius: 50%
              - width: 16px
              - height: 16px
              - background: var(--green)
              - z-index: 1
            icon:
              - color: var(--black)
              - width: 10px
      pic:
        card:
          type: custom:button-card
          entity: "[[[\n  return entity.entity_id;\n]]]\n"
          show_name: false
          show_entity_picture: true
          state:
            - value: not_home
              styles:
                entity_picture:
                  - filter: grayscale(100%)
          double_tap_action:
            action: assist
            pipeline_id: preferred
          styles:
            card:
              - background: none
              - box-shadow: none
            entity_picture:
              - width: 40px
              - height: 40px
              - border-radius: 12px
            img_cell:
              - background-color: var(--contrast1)
              - width: 40px
              - height: 40px
              - border-radius: 12px
      one:
        card:
          type: custom:button-card
          entity: "[[[\n  if (user.name == \"원규\") return \"person.eunbi\";\n  else\
            \ return \"person.saya6k\";\n]]]\n"
          show_name: false
          show_entity_picture: true
          state:
            - value: not_home
              styles:
                entity_picture:
                  - filter: grayscale(100%)
                  - opacity: 0.5
          styles:
            card:
              - background: none
              - box-shadow: none
              - z-index: 5
              - margin-left: 60px
            entity_picture:
              - width: 40px
              - height: 40px
              - border-radius: 12px
            img_cell:
              - background-color: var(--contrast1)
              - width: 40px
              - height: 40px
              - border-radius: 12px
      two:
        card:
          type: custom:button-card
          entity: "[[[\n  if (user.name == \"원규\") return \"person.abba\";\n  else\
            \ if (user.name == \"서현\") return \"person.abba\";\n  else return \"person.abba\"\
            ;\n]]]\n"
          show_name: false
          show_entity_picture: true
          state:
            - value: not_home
              styles:
                entity_picture:
                  - filter: grayscale(100%)
                  - opacity: 0.5
          styles:
            card:
              - background: none
              - box-shadow: none
              - z-index: 4
              - margin-left: 40px
            entity_picture:
              - width: 40px
              - height: 40px
              - border-radius: 12px
            img_cell:
              - background-color: var(--contrast1)
              - width: 40px
              - height: 40px
              - border-radius: 12px
      three:
        card:
          type: custom:button-card
          entity: "[[[\n  if (user.name == \"원규\") return \"person.eomma\";\n  else\
            \ if (user.name == \"Anna\") return \"person.eomma\";\n  else return \"\
            person.eomma\";\n]]]\n"
          show_name: false
          show_entity_picture: true
          state:
            - value: not_home
              styles:
                entity_picture:
                  - filter: grayscale(100%)
                  - opacity: 0.5
          styles:
            card:
              - background: none
              - box-shadow: none
              - z-index: 3
              - margin-left: 20px
            entity_picture:
              - width: 40px
              - height: 40px
              - border-radius: 12px
            img_cell:
              - background-color: var(--contrast1)
              - width: 40px
              - height: 40px
              - border-radius: 12px
      four:
        card:
          type: custom:button-card
          entity: "[[[\n  if (user.name == \"원규\") return \"person.guest\";\n  else\
            \ if (user.name == \"서현\") return \"person.guest\";\n  else return \"\
            person.guest\";\n]]]\n"
          show_name: false
          show_entity_picture: true
          state:
            - value: not_home
              styles:
                entity_picture:
                  - filter: grayscale(100%)
                  - opacity: 0.5
          styles:
            card:
              - background: none
              - box-shadow: none
              - z-index: 2
            entity_picture:
              - width: 40px
              - height: 40px
              - border-radius: 12px
            img_cell:
              - background-color: var(--contrast1)
              - width: 40px
              - height: 40px
              - border-radius: 12px
  custom_card_sensor_medium:
    template: setup
    variables:
      state: "[[[ \n  var st = states[entity.entity_id].state;\n  var uni = ' %';\n\
        \  return `\n  ${parseFloat(st).toFixed(0)}<span style=\"font-size:\n0.5em;opacity:0.7\"\
        >${uni}</span>\n  `\n]]]\n"
    show_label: true
    label: '[[[ return variables.state ]]]'
    styles:
      grid:
        - grid-template-columns: 62px 1fr
        - grid-template-areas: '"i l" "i n"'
      icon:
        - width: 24px
        - color: var(--contrast20)
      img_cell:
        - justify-self: start
        - width: 45px
        - height: 45px
        - background: var(--contrast1)
        - border-radius: 50%
        - margin-left: 7px
      label:
        - justify-self: start
        - font-size: 20px
        - padding-top: 4px
        - font-weight: 500
        - color: var(--contrast20)
      card:
        - height: 66px
        - border-radius: 24px
        - padding: 4px 20px 4px 4px
        - background: var(--contrast2)
      name:
        - justify-self: start
        - font-size: 11px
        - color: var(--contrast20)
        - opacity: 0.7
        - padding-bottom: 7px
  custom_card_sensor_small:
    template: setup
    variables:
      state: "[[[ \n  var st = states[entity.entity_id].state;\n  var uni = ' %';\n\
        \  return `\n  ${parseFloat(st).toFixed(0)}<span style=\"font-size:\n0.5em;opacity:0.7\"\
        >${uni}</span>\n  `\n]]]\n"
    show_label: true
    show_icon: false
    label: '[[[ return variables.state ]]]'
    styles:
      grid:
        - grid-template-columns: 1fr
        - grid-template-areas: '"l" "n"'
      label:
        - justify-self: start
        - font-size: 20px
        - padding-top: 4px
        - font-weight: 500
        - color: var(--contrast20)
      card:
        - height: 66px
        - border-radius: 24px
        - padding: 12px 10px 10px 14px
        - background: var(--contrast2)
      name:
        - justify-self: start
        - font-size: 11px
        - color: var(--contrast20)
        - opacity: 0.7
        - padding-bottom: 7px
  custom_card_mediaplayer_tv:
    template: setup
    icon: mdi:play
    label: "[[[\n  if (states[ entity.entity_id ].attributes.active_child == \"media_player.playstation_5\"\
      ) {\n    return 'Playstation'\n  } else if (states[ entity.entity_id ].attributes.active_child\
      \ == \"media_player.steam_jlnbln\") {\n    return 'Steam'\n  } else if (states[\
      \ entity.entity_id ].attributes.active_child == \"media_player.plex_bedroom\"\
      ) {\n    return 'Plex'\n  } else {\n    return states[entity.entity_id].attributes.app_name\n\
      \  }\n]]]\n"
    name: "[[[\n  if (states[ entity.entity_id ].attributes.active_child == \"media_player.playstation_5\"\
      ) {\n    return states[\"sensor.ps5_343_activity\"].attributes.players\n  }\
      \ else if (states[ entity.entity_id ].attributes.active_child == \"media_player.steam_jlnbln\"\
      ) {\n    return 'jlnbln'\n  } else if (states[ entity.entity_id ].attributes.active_child\
      \ == \"media_player.plex_bedroom\") {\n    return states[ entity.entity_id ].attributes.media_series_title\n\
      \  } else {\n    if (states[ entity.entity_id ].attributes.media_artist != null\
      \ ) {\n      return states[ entity.entity_id ].attributes.media_artist\n   \
      \ } else {\n      return \"Streaming\"\n    }\n  }\n]]]\n"
    show_label: true
    show_state: true
    state_display: "[[[\n  if (entity.state == 'off') {\n    return 'Nothing Playing'\n\
      \  } else {\n    return states[entity.entity_id].attributes.media_title\n  }\n\
      ]]]\n"
    styles:
      grid:
        - grid-template-areas: '''app_icon l i''

            ''s s s''

            ''n n n''

            '
        - grid-template-columns: min-content 1fr
        - grid-template-rows: min-content min-content min-content
        - column-gap: 10px
        - row-gap: 3px
      label:
        - justify-self: start
        - align-self: start
        - font-weight: 600
        - z-index: 1
        - font-size: 1rem
        - margin-top: 5px
      card:
        - padding: 15px
      icon:
        - height: 15px
        - width: 15px
        - color: var(--contrast16)
        - bottom: 4px
        - z-index: 1
      img_cell:
        - align-self: start
        - height: 15px
        - width: 15px
        - background: var(--contrast4)
        - border-radius: 6px
        - padding: 5px
        - z-index: 1
      name:
        - justify-self: start
        - align-self: end
        - color: var(--contrast16)
        - font-weight: 300
        - font-size: 0.9rem
        - z-index: 1
      state:
        - justify-self: start
        - font-weight: 700
        - font-size: 15px
        - z-index: 1
      custom_fields:
        app_icon:
          - width: 25px
          - height: 25px
          - margin-bottom: 20px
          - align-self: start
        background_cover:
          - position: absolute
          - left: 50%
          - bottom: 1px
          - border-radius: 1000px
          - transform: scale(1.3)
          - width: 110%
          - opacity: 80%
          - height: 13rem
          - background: "[[[\n  if (states[entity.entity_id].attributes.active_child\
