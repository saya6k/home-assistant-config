---
name: 🔖 Release (SemVer)

# yamllint disable-line rule:truthy
on:
  workflow_run:
    workflows:
      - '⚙️ ESPHome CI'
    types: [completed]

# Default to no privileges; each job re-grants only what it actually needs.
permissions: {}

concurrency:
  group: release-pages
  cancel-in-progress: true

jobs:
  release:
    name: 🔖 Release (SemVer)
    if: >
      github.repository == 'saya6k/home-assistant-config' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == 'saya6k/home-assistant-config'
    runs-on: ubuntu-latest
    # semantic-release/git + semantic-release/github need to push commits/tags
    # and create the GitHub Release. PAT is still required if branch protection
    # forbids GITHUB_TOKEN pushes — otherwise consider switching to GITHUB_TOKEN.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}

    steps:
      - name: ⤵️ Checkout at triggering SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Setup Node (for semantic-release)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: 🧪 Install deps if present (optional)
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci
          fi

      - name: 🚀 Run semantic-release (tags, GitHub Release, CHANGELOG)
        id: release
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4
        with:
          branch: main
          extra_plugins: |
            conventional-changelog-conventionalcommits
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: 📝 Summary
        env:
          PUBLISHED: ${{ steps.release.outputs.new_release_published }}
          VERSION: ${{ steps.release.outputs.new_release_version }}
        run: |
          set -euo pipefail
          {
            echo "published=${PUBLISHED}"
            echo "version=${VERSION}"
          } >> "${GITHUB_STEP_SUMMARY}"

  restart-addon:
    name: 🔄 Restart Git Pull Addon
    needs: release
    if: >
      github.repository == 'saya6k/home-assistant-config' &&
      needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Restart Git Pull via HA API
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
        run: |
          set -euo pipefail
          # Defensive: re-mask the token in case the runner did not pick it up
          # via the secrets context (e.g. when called through workflow_run).
          echo "::add-mask::${HA_TOKEN}"

          # Validate URL scheme — refuse to send the bearer token over plaintext
          # or to an unexpected origin.
          case "${HA_URL}" in
            https://*) ;;
            *)
              echo "HA_URL must use https://" >&2
              exit 1
              ;;
          esac

          curl --fail-with-body --silent --show-error --no-progress-meter \
            -X POST "${HA_URL%/}/api/services/hassio/addon_restart" \
            -H "Authorization: Bearer ${HA_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"addon":"core_git_pull"}' \
            -o /dev/null

# Note: GitHub Pages deployment is owned by the dedicated `Deploy docs`
# workflow (.github/workflows/pages.yml), which builds the docs with
# zensical. We intentionally do not deploy Pages from this workflow to
# avoid two jobs racing for the github-pages environment.
