---
name: 🔖 Release (SemVer)

# yamllint disable-line rule:truthy
on:
  workflow_run:
    workflows:
      - '⚙️ ESPHome CI'
    types: [completed]

# Default to no privileges; each job re-grants only what it actually needs.
permissions: {}

concurrency:
  group: release-pages
  cancel-in-progress: true

jobs:
  release:
    name: 🔖 Release (SemVer)
    if: >
      github.repository == 'saya6k/home-assistant-config' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == 'saya6k/home-assistant-config'
    runs-on: ubuntu-latest
    # semantic-release/git + semantic-release/github need to push commits/tags
    # and create the GitHub Release. PAT is still required if branch protection
    # forbids GITHUB_TOKEN pushes — otherwise consider switching to GITHUB_TOKEN.
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: ⤵️ Checkout at triggering SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Setup Node (for semantic-release)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: 🧪 Install deps if present (optional)
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci
          fi

      - name: 🚀 Run semantic-release (tags, GitHub Release, CHANGELOG)
        id: release
        uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34 # v8.1.3
        with:
          branch: main
          extra_plugins: |
            conventional-changelog-conventionalcommits@9
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: 📝 Summary
        env:
          PUBLISHED: ${{ steps.release.outputs.new_release_published }}
          VERSION: ${{ steps.release.outputs.new_release_version }}
        run: |
          set -euo pipefail
          {
            echo "published=${PUBLISHED}"
            echo "version=${VERSION}"
          } >> "${GITHUB_STEP_SUMMARY}"

# Note: GitHub Pages deployment is owned by the dedicated `Deploy docs`
# workflow (.github/workflows/pages.yml), which builds the docs with
# zensical. We intentionally do not deploy Pages from this workflow to
# avoid two jobs racing for the github-pages environment.
