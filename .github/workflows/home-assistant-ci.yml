---
name: 🏠 Home Assistant CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  home-assistant:
    name: 🧪 Home Assistant Core Config Check (${{ matrix.version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        version: ['stable', 'beta', 'dev']
    steps:
      - name: ⤵️ Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📥 Clone custom component - OpenID Connect for Home Assistant
        # Pinned to v1.1.0 — bump deliberately, do not move to a floating ref.
        env:
          OIDC_REF: '0164cd2829909d9980fb2a7deb553c24cc9d637a'
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/christiaangoossens/hass-oidc-auth.git
          git -C hass-oidc-auth fetch --depth=1 origin "${OIDC_REF}"
          git -C hass-oidc-auth checkout "${OIDC_REF}"
          mv -v hass-oidc-auth/custom_components/* custom_components

      - name: 🗝️ Generate mock secrets
        uses: golles/mock-yaml-secrets-action@d6c5dcb9889077e44827c50e5f6bdac3636c89e5 # v1.1.2
        with:
          configFile: '.github/workflows/mock-secrets-config.json'

      - name: 🚀 Validate Home Assistant Configuration
        uses: frenck/action-home-assistant@941d5d917f4c1c7a7e7d4087526daf90d53f4437 # v1.4.1
        with:
          path: '.'
          version: ${{ matrix.version }}
