---
name: ⚙️ ESPHome CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  esphome:
    name: 🔌 ESPHome Configuration Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⤵️ Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: 🗝️ Generate mock secrets for ESPHome
        uses: golles/mock-yaml-secrets-action@d6c5dcb9889077e44827c50e5f6bdac3636c89e5 # v1.1.2
        with:
          configFile: '.github/workflows/mock-esphome-secrets-config.json'

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: 📦 Install ESPHome dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install esphome
          pip list
          esphome version

      - name: 🔍 Validate ESPHome configuration files
        # yamllint disable rule:line-length
        run: |
          find ./esphome -maxdepth 1 -type f -name "*.yaml" -not -name "secrets.yaml" -exec esphome {} config \;
