---
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.*.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install zensical
        run: pip install zensical==0.0.43 pymdown-extensions==10.21.3

      - name: Stage Korean docs (docs/ → docs/ko/, excluding docs/en/)
        run: |
          set -euo pipefail
          rm -rf docs/ko
          mkdir -p docs/ko
          rsync -a --exclude='ko/' --exclude='en/' docs/ docs/ko/

      - name: Build Korean site
        run: zensical build -f zensical.ko.toml

      - name: Build English site
        run: zensical build -f zensical.en.toml

      - name: Root redirect → /ko/
        run: |
          set -euo pipefail
          mkdir -p _site
          printf '<!doctype html><meta http-equiv="refresh" content="0;url=ko/">' \
              > _site/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
