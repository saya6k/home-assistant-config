esphome:
  name: nano-c6
  friendly_name: nano-c6

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "REDACTED-esphome-key"

ota:
  - platform: esphome
    password: "REDACTED-esphome-password"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Nano-C6 Fallback Hotspot"
    password: "OF16UB6EsnLm"

captive_portal:
    